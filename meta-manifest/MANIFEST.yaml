# MANIFEST.yaml
# Instance data for this kit. Governed by SKILL.md in the same directory.
# Updated only through the skill-builder process with developer approval.

kit_identity:
  kit_name: base-building-kit
  kit_type: base
  category: base
  version: 0.6
  parent_kit: null
  status: active

nodes:

  - id: base-foundation
    concern: Philosophical foundation and operational frame — what this work is, the human's role, the agent's role, the governing aspects
    skill_file: meta-foundation/SKILL.md
    layer: meta
    phase: [pre-build, during-build, post-build]
    status: mature
    dependencies: []
    open_gaps: []
    note: Load before all other skills. Takes precedence over all other kit nodes including governance in meta-manifest.

  - id: base-bootstrap
    concern: First-run installation — introduces the practice to the developer, establishes kit authority in the environment, orients to the project, creates the project manifest
    skill_file: meta-bootstrap/SKILL.md
    layer: meta
    phase: [pre-build]
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Runs once per project. After completion the kit is load-bearing and this skill is not invoked again.

  - id: base-contract
    concern: Contract before execution — three-tier proposal, approval gate, standard evolution report
    skill_file: meta-contract-before-execution/SKILL.md
    layer: meta
    phase: [pre-build, post-build]
    status: mature
    dependencies: []
    open_gaps:
      - Proposal format not yet templated for non-developer legibility
      - No guidance on handling partial approvals

  - id: base-skill-builder
    concern: Abstraction loop — classifying learnings, updating skills, raising the standard
    skill_file: meta-skill-builder/SKILL.md
    layer: meta
    phase: [post-build]
    status: mature
    dependencies: [base-contract]
    open_gaps:
      - No guidance on deprecating outdated nodes
      - Conflict resolution between two nodes covering overlapping concerns not addressed

  - id: base-manifest
    concern: Kit topology — node registry, coverage map, gap tracking, self-organisation
    skill_file: meta-manifest/SKILL.md
    data_file: meta-manifest/MANIFEST.yaml
    layer: meta
    phase: [pre-build]
    status: mature
    dependencies: []
    open_gaps:
      - Library forking process not defined
      - No versioning strategy for breaking changes to node schema

  # --- Type-category nodes (to be built through use) ---
  # Naming convention: [layer]-[name]/SKILL.md
  # Layer prefixes: principle- | pattern- | implementation- | meta-
  # The folder carries layer identity. The file is always SKILL.md.
  # Manifest skill_file field uses the joined form: pattern-foo/SKILL.md
  #
  # Uncomment and fill when a node is created:
  #
  # - id: [concern-id]
  #   concern: [what area this node owns — be precise]
  #   skill_file: [layer]-[name]/SKILL.md
  #   layer: [principle | pattern | implementation | meta]
  #   phase: [pre-build | during-build | post-build]
  #   status: [mature | thin | missing]
  #   dependencies: [list of node ids this depends on]
  #   open_gaps:
  #     - [known hole or empty]

