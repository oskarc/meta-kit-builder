# MANIFEST.yaml
# Instance data for the base-building-kit. Governed by meta-manifest/SKILL.md.
# Updated only through the skill-builder process with developer approval.

kit_identity:
  kit_name: base-building-kit
  kit_type: base
  category: base
  version: 0.9
  parent_kit: null
  status: active

nodes:

  - id: base-foundation
    concern: Philosophical foundation and operational frame — what this work is, the human's role, the agent's role, the governing aspects
    skill_file: meta-foundation/SKILL.md
    layer: meta
    phase: always
    status: mature
    dependencies: []
    open_gaps: []
    note: Load before all other skills. Takes precedence over all other kit nodes.

  - id: base-bootstrap
    concern: First-run installation — introduces the practice, checks library for existing type-category kit, establishes kit authority, orients to the project, creates project-level manifest from template
    skill_file: meta-bootstrap/SKILL.md
    layer: meta
    phase: pre-build
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Runs once per project. Not part of the regular load order after first run.

  - id: base-contract
    concern: Contract before execution — three-tier proposal, approval gate, standard evolution report
    skill_file: meta-contract-before-execution/SKILL.md
    layer: meta
    phase: [pre-build, post-build]
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-skill-builder
    concern: Abstraction loop — classifying learnings, updating skills, raising the standard
    skill_file: meta-skill-builder/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-contract]
    open_gaps: []

  - id: base-manifest
    concern: Kit topology — node registry, coverage map, gap tracking, self-organisation
    skill_file: meta-manifest/SKILL.md
    data_file: meta-manifest/MANIFEST.yaml
    layer: meta
    phase: pre-build
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-antidrift
    concern: Post-output drift scoring — compact evidence-based check against governing aspects and active skills after every output
    skill_file: meta-antidrift/SKILL.md
    layer: meta
    phase: always
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Runs after every output. Must be in the continuous load order.

  - id: base-antidrift-expand
    concern: Session-level drift analysis — full pattern mapping, implicit approval accumulation, discipline fall point, elevation vs recovery assessment
    skill_file: meta-antidrift-expand/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-antidrift, base-foundation]
    open_gaps: []
    note: Invoked explicitly by the human. Not part of the continuous load order.

  - id: base-drift-eventlog
    concern: Persistent drift log — durable cross-session record of flagged incidents, their evidence, the in-session reaction, and the lifecycle of any elevation that absorbed the learning
    skill_file: meta-drift-eventlog/SKILL.md
    data_file: meta-drift-eventlog/DRIFTLOG.yaml
    layer: meta
    phase: always
    status: mature
    dependencies: [base-antidrift, base-foundation]
    open_gaps: []
    note: DRIFTLOG.yaml is read at session start alongside MANIFEST.yaml. Entries are written only at end-of-session or on human-flagged drift — never silently. Governance travels via meta-extract; instance history does not.

  - id: base-extract
    concern: Type-category kit extraction — separates transferable nodes from project nodes, produces library artifact and META.yaml
    skill_file: meta-extract/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-manifest, base-skill-builder]
    open_gaps: []
    note: Run when developer decides type-category nodes are mature enough for the library.

coverage_map:

  - concern: Philosophical foundation & governing aspects
    node_id: base-foundation
    layer: meta
    phase: always
    status: mature

  - concern: Project onboarding & authority establishment
    node_id: base-bootstrap
    layer: meta
    phase: pre-build
    status: mature

  - concern: Contract & proposal
    node_id: base-contract
    layer: meta
    phase: [pre-build, post-build]
    status: mature

  - concern: Skill evolution
    node_id: base-skill-builder
    layer: meta
    phase: post-build
    status: mature

  - concern: Kit topology
    node_id: base-manifest
    layer: meta
    phase: pre-build
    status: mature

  - concern: Post-output drift scoring
    node_id: base-antidrift
    layer: meta
    phase: always
    status: mature

  - concern: Session-level drift analysis
    node_id: base-antidrift-expand
    layer: meta
    phase: post-build
    status: mature

  - concern: Persistent cross-session drift log
    node_id: base-drift-eventlog
    layer: meta
    phase: always
    status: mature

  - concern: Type-category extraction & library promotion
    node_id: base-extract
    layer: meta
    phase: post-build
    status: mature

gap_queue:
  # Gaps surface through use — not invented upfront.
  # All prior gaps (001-007) were development history resolved during
  # the build of the base kit. Preserved below for reference.

  - gap_id: gap-001
    concern: Manifest — doc/data co-location
    surfaced_by: contract-before-execution
    surfaced_in: base-kit first use
    description: Single manifest file mixed governance prose with instance data, causing merge conflicts on template updates
    candidate_level: pattern
    priority: high
    status: resolved
    resolved_by: base-manifest split into meta-manifest/SKILL.md + MANIFEST.yaml

  - gap_id: gap-002
    concern: Naming convention — layer prefix vs loader auto-discovery
    surfaced_by: contract-before-execution
    surfaced_in: base-kit rename pass
    description: meta-skill-builder instructed flat file naming which conflicts with Claude Code loader requiring SKILL.md. Convention was unstated.
    candidate_level: pattern
    priority: high
    status: resolved
    resolved_by: Convention clarified — folder carries layer prefix, file is always SKILL.md, manifest uses joined form

  - gap_id: gap-003
    concern: Template drift — exemplars and template blocks edited independently
    surfaced_by: contract-before-execution
    surfaced_in: base-kit rename pass
    description: After renaming filled nodes to folder/SKILL.md form, template comment block still showed old flat-file form.
    candidate_level: principle
    priority: medium
    status: resolved
    resolved_by: Template drift added as anti-pattern to meta-skill-builder

  - gap_id: gap-004
    concern: Incomplete resolution — gap-003 marked resolved while exemplars still contained the bug
    surfaced_by: manual
    surfaced_in: base-kit review after gap-003 resolution
    description: Template comment block was corrected but three filled exemplars still used flat form. Resolution fixed the definition but not the instance.
    candidate_level: principle
    priority: high
    status: resolved
    resolved_by: Exemplar paths updated. Template drift anti-pattern strengthened with self-check step.

  - gap_id: gap-005
    concern: Bootstrap drift — kit named meta-kit-builder instead of base-building-kit
    surfaced_by: manual
    surfaced_in: bootstrap audit
    description: meta-bootstrap referenced the repo name instead of the kit name in two places.
    candidate_level: principle
    priority: medium
    status: resolved
    resolved_by: Both references updated to base-building-kit

  - gap_id: gap-006
    concern: Bootstrap drift — tier model collapsed project and type-category into one
    surfaced_by: manual
    surfaced_in: bootstrap audit
    description: Step 4 created every new project as kit_type type-category, conflating the project context with the overarching standard.
    candidate_level: principle
    priority: high
    status: resolved
    resolved_by: kit_type is now project. category field names the type-category standard.

  - gap_id: gap-007
    concern: Bootstrap drift — vocabulary used type-category to mean uncommitted project nodes
    surfaced_by: manual
    surfaced_in: bootstrap audit
    description: Original wording used type-category loosely to mean nodes not yet built at project level.
    candidate_level: principle
    priority: medium
    status: resolved
    resolved_by: Vocabulary corrected. Project nodes are project nodes. Type-category kit is a separate artifact.

  - gap_id: gap-008
    concern: Duplicate keys in MANIFEST.yaml — str_replace edits created shadowed blocks
    surfaced_by: manual
    surfaced_in: external review
    description: Multiple str_replace edits inserted new content at the top of MANIFEST.yaml while leaving old blocks intact. Parser silently used last-wins, shadowing the new content.
    candidate_level: principle
    priority: high
    status: resolved
    resolved_by: Full clean rewrite from template shape. Lay of the land violated — file was not read in full before being modified.

  # Add new gaps below as they surface:
  #
  # - gap_id: gap-NNN
  #   concern: [area]
  #   surfaced_by: [contract-before-execution | skill-builder | manual]
  #   surfaced_in: [session or feature]
  #   description: [what the kit could not handle]
  #   candidate_level: [principle | pattern | implementation | unknown]
  #   priority: [high | medium | low]
  #   status: [open | in-progress | resolved]
  #   resolved_by: [skill or node that closed this, when resolved]

library_entry: null
