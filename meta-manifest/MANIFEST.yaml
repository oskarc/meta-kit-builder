gap_queue:
  - gap_id: gap-001
    concern: Manifest — doc/data co-location
    surfaced_by: contract-before-execution
    surfaced_in: base-kit first use
    description: Single manifest file mixed governance prose with instance data, causing merge conflicts on template updates
    candidate_level: pattern
    priority: high
    status: resolved
    resolved_by: base-manifest split into meta-manifest/SKILL.md + MANIFEST.yaml

  - gap_id: gap-002
    concern: Naming convention — layer prefix vs loader auto-discovery
    surfaced_by: contract-before-execution
    surfaced_in: base-kit rename pass
    description: meta-skill-builder instructed flat file naming (meta-[name].md) which conflicts with Claude Code loader requiring SKILL.md. Convention was unstated — a reader following it literally would get a silent load failure.
    candidate_level: pattern
    priority: high
    status: resolved
    resolved_by: Convention clarified — folder carries layer prefix, file is always SKILL.md, manifest uses joined form

  - gap_id: gap-003
    concern: Template drift — exemplars and template blocks edited independently
    surfaced_by: contract-before-execution
    surfaced_in: base-kit rename pass
    description: After renaming filled nodes to folder/SKILL.md form, template comment block still showed old flat-file form. Standard contradicted itself within one file.
    candidate_level: principle
    priority: medium
    status: resolved
    resolved_by: Template drift added as anti-pattern to meta-skill-builder

  - gap_id: gap-004
    concern: Incomplete resolution — gap-003 marked resolved while exemplars still contained the bug
    surfaced_by: manual
    surfaced_in: base-kit review after gap-003 resolution
    description: Template comment block was corrected to joined form but three filled exemplars still used flat form. gap-003 was marked resolved prematurely — the resolution fixed the anti-pattern definition but not the instance of it in the same file.
    candidate_level: principle
    priority: high
    status: resolved
    resolved_by: Exemplar skill_file paths updated to folder/SKILL.md form. Note — this is a second instance of template drift, suggesting the anti-pattern should include an explicit self-check step after any resolution.
  #
  # - gap_id: gap-NNN
  #   concern: [area]
  #   surfaced_by: [contract-before-execution | skill-builder | manual]
  #   surfaced_in: [session or feature]
  #   description: [what the agent had to improvise]
  #   candidate_level: [principle | pattern | implementation | unknown]
  #   priority: [high | medium | low]
  #   status: [open | in-progress | resolved]
  #   resolved_by: [skill or node that closed this, when resolved]

