# MANIFEST.yaml
# Instance data for the base-building-kit. Governed by meta-manifest/SKILL.md.
# Updated only through the skill-builder process with developer approval.
# kit_type: base is what tells the mechanisms they are not installed in a project (meta-mechanisms).

kit_identity:
  kit_name: base-building-kit
  kit_type: base
  category: base
  version: 0.26            # the six-layer form after contracts 003–018: tier 4, ownership, the subtraction, upgrade readiness, the upgrade that compares by mechanism, the first real run's gaps closed
  parent_kit: null
  workspace: []
  status: active

nodes:

  # ─── Layer 1 · Intent (always loaded) ─────────────────────────────────────

  - id: base-intent
    concern: Always-loaded distillation of the foundation — the aspects in their own words, how work moves in the six-layer form, the drift score block
    kind: intent
    skill_file: meta-foundation/INTENT.md
    owns: [meta-foundation/INTENT.md]
    layer: meta
    phase: always
    load: always
    triggers: [M-09, M-10, M-28]
    status: thin
    dependencies: [base-foundation]
    open_gaps:
      - Drafted by the agent in contract-001 from the foundation's own sentences; awaiting the pioneer's ratification (gap-019).
    note: Imported by CLAUDE.md with FOUNDING.md and MAP.md.

  - id: base-founding-contract
    concern: The project's own statement of what it is — immutable original plus dated amendments (each naming its cause and what it now binds); the two-sentence bearing every contract opens with; redraw vs reevaluation
    kind: skill
    skill_file: meta-founding-contract/SKILL.md
    data_file: meta-founding-contract/FOUNDING.md
    owns: [meta-founding-contract/FOUNDING.md, meta-founding-contract/SKILL.md]
    layer: meta
    phase: always
    load: trigger
    triggers: [M-24]
    status: thin
    dependencies: [base-foundation]
    open_gaps:
      - Ported from a downstream kit on 2026-09-03 with one instance of use. Form checks are partly mechanised (missing bearing, amendment shape); byte-unchanged original and two-sentence length are not (gap-009).
    note: FOUNDING.md is always loaded via CLAUDE.md. Never copied from another project, never extracted.

  # ─── Layer 2 · Map ────────────────────────────────────────────────────────

  - id: base-map
    concern: When to use what — MAP.md, the always-loaded index from named moments to one-hop pointers; entry format, closed vocabulary, siblings, ratification, telemetry and stewardship
    kind: map
    skill_file: meta-map/SKILL.md
    data_file: meta-map/MAP.md
    owns: [meta-map/MAP.md, meta-map/SKILL.md]
    layer: meta
    phase: always
    load: trigger
    triggers: [M-22]
    status: thin
    dependencies: [base-intent]
    open_gaps:
      - 31 base entries drafted by the agent; none ratified (gap-019). No firing telemetry yet.
      - Compressed to 6,900 bytes on 2026-09-12 to hold the ~8 KB guarantee, then 7,133 with M-31 (contract-004), then back to 30 entries when contract-006 withdrew M-31 — measured in meta-map/SKILL.md. The prune-rather-than-extend rule that governs the rest has never been exercised (O-016).
      - Entries whose firing evidence is a `subagent` or `reveal` line, or whose target is always loaded, cannot be judged by load counts; the steward is told which, but nothing enforces it.
    note: MAP.md is always loaded via CLAUDE.md; this node's SKILL.md loads on trigger.

  # ─── Layer 3 · Nodes (on trigger) ─────────────────────────────────────────

  - id: base-foundation
    concern: Philosophical foundation and operational frame — what this work is, the human's role, the agent's role, the governing aspects, and how maturity is read against the instruments
    kind: skill
    skill_file: meta-foundation/SKILL.md
    owns: [meta-foundation/SKILL.md, meta-foundation/INTENT.md]
    layer: meta
    phase: always
    load: trigger
    triggers: [M-03]
    status: mature
    dependencies: []
    open_gaps: []
    note: Absolute precedence. Carried every session through INTENT.md; loaded in full when the frame is in question.

  - id: base-bootstrap
    concern: First-run installation and upgrade — introduces the practice, orients before changing anything, records the founding contract verbatim, installs mechanisms and agents, writes the install baseline, seeds every instance file from templates
    kind: skill
    skill_file: meta-bootstrap/SKILL.md
    owns: [meta-bootstrap/SKILL.md, templates/, meta-manifest/INSTALLED.sha1]
    layer: meta
    phase: pre-build
    load: trigger
    triggers: [M-27]
    status: thin
    dependencies: [base-foundation, base-mechanisms]
    open_gaps:
      - Neither the install nor the upgrade path has been run. The upgrade's untouched-vs-evolved classification depends on INSTALLED.sha1, which nothing verifies (gap-024).

  - id: base-contract
    concern: Contract before execution — bearing, spec lock, precedent check, four-tier proposal with clause ids and tier-4 acceptance tests, approval gate with correction grades, contract log with verification, audit and transcript markers, observations recorded after implementation
    kind: skill
    skill_file: meta-contract-before-execution/SKILL.md
    data_file: meta-contract-before-execution/CONTRACT-LOG.yaml
    owns: [meta-contract-before-execution/CONTRACT-LOG.yaml, meta-contract-before-execution/SKILL.md]
    layer: meta
    phase: [pre-build, post-build]
    load: trigger
    triggers: [M-04, M-05, M-06, M-08, M-11]
    status: thin
    dependencies: [base-founding-contract, base-casebook, base-ledger]
    open_gaps:
      - The Standard Evolution Report now records to the ledger instead of presenting; unexercised.
      - Contracts 001–003 were approved with the gate waived at spec lock (approval: waived-at-spec-lock); contract-004 is the first seen in full at the gate, and the first with a Tier 4. The three earlier ones have no acceptance tests and are verifiable by reading only.

  - id: base-contract-artifact
    concern: Contract delivery — every approved contract is also published as an artifact, stored as HTML, and registered with verification status (Verified/Corrected/Open) taken from the verifier's clause verdicts
    kind: skill
    skill_file: meta-contract-artifact/SKILL.md
    owns: [meta-contract-artifact/]
    layer: meta
    phase: [pre-build, post-build]
    load: trigger
    triggers: [M-06, M-25]
    status: thin
    dependencies: [base-contract]
    open_gaps:
      - Both templates have exactly one real instance of use — not battle-tested across feature shapes.
      - Requires the Artifact-publishing capability; an environment without it should flag the gap rather than silently skip the published leg.
      - Reworked in v0.14 (the log entry is the record; verifier verdicts source the page's states) and unexercised since.

  - id: base-skill-builder
    concern: Review batches and the abstraction loop — statement before evidence, the pioneer's level and tier recorded at adopt, re-presented decisions shown beside their earlier ones after the reveal, cautions written into anti-patterns, drift back-references with mitigation medium
    kind: skill
    skill_file: meta-skill-builder/SKILL.md
    owns: [meta-skill-builder/SKILL.md, meta-ledger/batches/]
    layer: meta
    phase: post-build
    load: trigger
    triggers: [M-16, M-17, M-22]
    status: thin
    dependencies: [base-ledger]
    open_gaps:
      - No batch has run. The reveal sequence (close, reveal, apply, set revealed) is the lifecycle's most failure-prone stretch — its first version deadlocked (drift-002).
      - Terminal values are prose, not schema: nothing checks that a reveal wrote one, and the gate counts pending markers, so a forgotten terminal value re-presents the same item forever (gap-027).
      - update / retire / add at a quoted passage (contract-004) is a written rule; no batch has applied one, and "retire the node when the passage was its reason to exist" is a judgement the reveal step leaves to the main agent and the pioneer.

  - id: base-learning
    concern: Verification-gated learning diff — contracted prediction vs verified reality, State C built only from the verification record, elevation proposals recorded as ledger observations
    kind: skill
    skill_file: meta-learning/SKILL.md
    data_file: meta-learning/LEARNINGLOG.yaml
    owns: [meta-learning/LEARNINGLOG.yaml, meta-learning/SKILL.md]
    layer: meta
    phase: post-build
    load: trigger
    triggers: [M-13]
    status: thin
    dependencies: [base-contract, base-ledger]
    open_gaps:
      - Trigger moved from the pioneer to the stop-gate; unexercised in the new form.

  - id: base-manifest
    concern: Kit topology — node registry with kind, load mode and triggers; coverage map; gap tracking; instrumented library promotion
    kind: skill
    skill_file: meta-manifest/SKILL.md
    data_file: meta-manifest/MANIFEST.yaml
    owns: [meta-manifest/MANIFEST.yaml, meta-manifest/SKILL.md]
    layer: meta
    phase: pre-build
    load: trigger
    triggers: [M-22, M-23]
    status: thin
    dependencies: []
    open_gaps:
      - Schema extended in v0.14 (kind, load, triggers, base_kit_version); promotion criteria now instrumented and untested.
      - owns: and status: retired added by contract-004; no node has been retired yet, so the reassignment of orphaned records is a written rule with no instance.

  - id: base-antidrift
    concern: Post-output drift scoring — the block lives in INTENT.md; scoring rules here; runs alongside the session auditor's outside score
    kind: skill
    skill_file: meta-antidrift/SKILL.md
    owns: [meta-antidrift/SKILL.md]
    layer: meta
    phase: always
    load: trigger
    triggers: [M-28]
    status: mature
    dependencies: [base-foundation]
    open_gaps: []

  - id: base-antidrift-expand
    concern: Session-level drift analysis — pattern mapping, implicit approval accumulation, drift onset point, and an elevation-vs-recovery assessment recorded as observations rather than a verdict
    kind: skill
    skill_file: meta-antidrift-expand/SKILL.md
    owns: [meta-antidrift-expand/SKILL.md]
    layer: meta
    phase: post-build
    load: trigger
    triggers: [M-19]
    status: thin
    dependencies: [base-antidrift, base-foundation, base-ledger]
    open_gaps:
      - Section 6 was an agent-held elevate/discard filter until v0.14; it now writes observations with a compromised-session code, and has not run in that form.

  - id: base-drift-eventlog
    concern: Persistent drift log — evidence, reaction, elevation lifecycle and mitigation medium; recurrence after a prose mitigation routes to a mechanism; resolution is the pioneer's at a batch
    kind: record
    skill_file: meta-drift-eventlog/SKILL.md
    data_file: meta-drift-eventlog/DRIFTLOG.yaml
    owns: [meta-drift-eventlog/DRIFTLOG.yaml, meta-drift-eventlog/SKILL.md]
    layer: meta
    phase: always
    load: trigger
    triggers: [M-08, M-18]
    status: thin
    dependencies: [base-antidrift, base-foundation]
    open_gaps:
      - How to Read, the resolution criterion and the update protocol were rewritten for the hook-driven form in v0.14; the auditor-proposed entry path has not run.

  - id: base-extract
    concern: Type-category extraction — separates transferable nodes, runs a blind reconstruction test, carries map entries and type-category precedents with bindings, reports instruments in META.yaml
    kind: skill
    skill_file: meta-extract/SKILL.md
    owns: [meta-extract/SKILL.md]
    layer: meta
    phase: post-build
    load: trigger
    triggers: [M-26]
    status: thin
    dependencies: [base-manifest, base-skill-builder, base-casebook]
    open_gaps:
      - No extraction has run in the new form.

  - id: base-correction-log
    concern: The pioneer's corrections, verbatim and graded, with intervention level and supersession; the fading curve that shows whether the pioneer's role is evolving
    kind: record
    skill_file: meta-correction-log/SKILL.md
    data_file: meta-correction-log/CORRECTIONS.yaml
    owns: [meta-correction-log/CORRECTIONS.yaml, meta-correction-log/SKILL.md]
    layer: meta
    phase: always
    load: trigger
    triggers: [M-07]
    status: thin
    dependencies: [base-foundation]
    open_gaps:
      - New in v0.14. Four corrections recorded from the session that built it; none clerked.

  # ─── Layer 4 · Casebook (retrieved) ───────────────────────────────────────

  - id: base-casebook
    concern: Binding precedents with their facts, scenario cards ranked only by the pioneer, precedent conflicts and strain routed to review batches, reconstruction tests; type-category precedents travel with bindings
    kind: record
    skill_file: meta-casebook/SKILL.md
    data_file: meta-casebook/CASEBOOK.yaml
    owns: [meta-casebook/CASEBOOK.yaml, meta-casebook/reconstruction/, meta-casebook/SKILL.md]
    layer: meta
    phase: [pre-build, post-build]
    load: trigger
    triggers: [M-04, M-05, M-26]
    status: thin
    dependencies: [base-correction-log]
    open_gaps:
      - New in v0.14; empty. Blinding within the casebook during reconstruction rests on an instruction, not a mechanism (gap-023).
      - The rebuild was withdrawn from the map by contract-006; docs/rebuild-design.md holds the six conditions for its return (gap-030).

  # ─── Layer 5 · Mechanisms (fire) ──────────────────────────────────────────

  - id: base-mechanisms
    concern: Hooks that run the lifecycle (session-start, prompt-submit, stop-gate, subagent-stop, post-read), the batch blind, agent path scopes, the sealed key, close/reveal scripts, telemetry, and the marker-key contract
    kind: mechanism
    skill_file: meta-mechanisms/SKILL.md
    owns: [meta-mechanisms/hooks/, meta-mechanisms/tests/, meta-mechanisms/SKILL.md]
    layer: meta
    phase: always
    load: fires
    triggers: [M-01, M-02, M-07, M-11, M-12, M-13, M-14, M-15, M-16, M-17, M-21, M-24, M-30]
    status: thin
    dependencies: [base-map, base-ledger]
    open_gaps:
      - Scripts pass fixture tests, including a walk of one batch and one contract through every state, but have not run inside a live Claude Code session (gap-012).
      - Nothing validates a schema against the marker-key contract; a renamed key or an unlisted value switches a mechanism off silently (gap-015, gap-025).
      - Write scopes match Write and Edit only; the four agents that also hold Bash are kept inside their paths by instruction, not by the mechanism (gap-022).
      - owner-check.sh (contract-004) reads the manifest in both its forms and has passed 16 fixtures, but has not fired in a live session; whether a bypass line means dead weight or mis-routing cannot be told apart until gap-025's schema check exists (O-014).
      - The telemetry blind (contract-005) reads the Grep glob field, not the Glob tool's pattern: a Glob naming telemetry.log with no path is allowed. It returns the filename, never a line of the file, so no count leaks; stated here as the verifier found it, not yet in the node's limits paragraph.
      - The stop-gate's question guard is a heuristic — cut at the last drift-score marker, look for a "?" in the closing stretch — calibrated to over-defer rather than bury a question (gap-026).

  - id: agent-verifier
    concern: Clause-by-clause verification against evidence from outside the builder; blind to the builder's account and to the kit's evidence records
    kind: agent
    agent_file: agents/kit-verifier.md
    layer: meta
    phase: post-build
    load: fires
    triggers: [M-12]
    status: thin
    dependencies: [base-contract, base-mechanisms]
    open_gaps: []

  - id: agent-consolidator
    concern: Sole writer of candidates — merges observations, counts evidence by whether it came from a different reading, review flags, fading, outcomes and scores that never score the pioneer
    kind: agent
    agent_file: agents/kit-consolidator.md
    layer: meta
    phase: post-build
    load: fires
    triggers: [M-14]
    status: thin
    dependencies: [base-ledger, base-mechanisms]
    open_gaps: []

  - id: agent-map-steward
    concern: Proposes map changes from misses, firing telemetry and desk probes; never edits the map
    kind: agent
    agent_file: agents/kit-map-steward.md
    layer: meta
    phase: post-build
    load: fires
    triggers: [M-21]
    status: thin
    dependencies: [base-map, base-ledger, base-mechanisms]
    open_gaps: []

  - id: agent-batch-assembler
    concern: Assembles review batches from pioneer-owned items, re-presents up to two decided candidates from the fourth batch on, strips ledger ids, seals the key
    kind: agent
    agent_file: agents/kit-batch-assembler.md
    layer: meta
    phase: post-build
    load: fires
    triggers: [M-16]
    status: thin
    dependencies: [base-ledger, base-mechanisms]
    open_gaps:
      - Re-presented items replaced planted canaries in contract-006; whether re-presenting a real decided item measures the gate's consistency, or only the pioneer's memory, is unknown until batches have run (gap-014).
      - The batch blind closes the presenter's view of the ledger, but the pioneer can still read it; re-presentation measures a gate read as presented (gap-020).

  - id: agent-case-clerk
    concern: Clerks corrections into precedents and scenario-card drafts, routes conflicts and strain to the pioneer, recomputes the fading curve; never supplies reasons or rankings
    kind: agent
    agent_file: agents/kit-case-clerk.md
    layer: meta
    phase: post-build
    load: fires
    triggers: [M-15]
    status: thin
    dependencies: [base-correction-log, base-casebook, base-mechanisms]
    open_gaps: []

  - id: agent-session-auditor
    concern: Evidence-of-form checks and an outside score of the agent's aspects from the transcript, compared with the session's own; records missed corrections and map misses, proposes drift entries
    kind: agent
    agent_file: agents/kit-session-auditor.md
    layer: meta
    phase: post-build
    load: fires
    triggers: [M-11]
    status: thin
    dependencies: [base-antidrift, base-ledger, base-mechanisms]
    open_gaps:
      - Transcript files sit outside the working directory and may prompt for read permission (gap-018).
      - It reads the main session's transcript only; kit agents' own transcripts, which record what each agent read, go unaudited (gap-021).

  - id: agent-recorder
    concern: Appends observations handed to it while a review batch closes the ledger to the presenting session; transcribes only, judges nothing
    kind: agent
    agent_file: agents/kit-recorder.md
    layer: meta
    phase: post-build
    load: fires
    triggers: [M-11]
    status: thin
    dependencies: [base-ledger, base-mechanisms]
    open_gaps:
      - Added in contract-003 on the pioneer's own suggestion, in place of a helper script (C-005). Unexercised.

  - id: agent-reconstructor
    concern: Blind reconstruction test — predicts the pioneer's decisions from the kit alone, or reports the kit silent
    kind: agent
    agent_file: agents/kit-reconstructor.md
    layer: meta
    phase: post-build
    load: fires
    triggers: [M-26]
    status: thin
    dependencies: [base-casebook, base-mechanisms]
    open_gaps:
      - Added during contract-001 without the pioneer's authorisation; authorised on 2026-09-12 and recorded as a revision on contract-001. The incident stays on record as drift-001 (watching).
      - Its blindness to the casebook rests on an excluded-precedent list it is instructed to honour, not a mechanism (gap-023) — the agent's own result is therefore the weaker kind of evidence.

  # ─── Layer 6 · Ledger (offline) ───────────────────────────────────────────

  - id: base-ledger
    concern: Evidence layer — observations with frozen stated confidence, held candidates with counters by reading, review batches with re-presented items, no score of the pioneer; audits, scores and maturity instruments — WAS: review batches with canaries, map proposals, audits, scores and maturity instruments
    kind: record
    skill_file: meta-ledger/SKILL.md
    data_file: meta-ledger/LEDGER.yaml
    owns: [meta-ledger/LEDGER.yaml, meta-ledger/telemetry.log, meta-ledger/SKILL.md]
    layer: meta
    phase: post-build
    load: offline
    triggers: [M-20, M-29]
    status: thin
    dependencies: [base-foundation]
    open_gaps:
      - New in v0.14. Seventeen observations recorded from contracts 001, 002 and 004; nothing consolidated, because this repo does not run its own mechanisms (gap-016).
      - contradicts: and the update/retire/add exits (contract-004) have been exercised once, on a fixture (T-7); no real candidate has carried a quoted passage through a batch.
      - Independence rules borrow from multi-party standards bodies; with one pioneer and one model family, what counts as independent is not established (gap-013).

coverage_map:

  - {concern: Always-loaded intent, node_id: base-intent, layer: meta, phase: always, status: thin}
  - {concern: Philosophical foundation & governing aspects, node_id: base-foundation, layer: meta, phase: always, status: mature}
  - {concern: Founding contract & contract bearing, node_id: base-founding-contract, layer: meta, phase: always, status: thin}
  - {concern: When to use what — the map, node_id: base-map, layer: meta, phase: always, status: thin}
  - {concern: Project onboarding, authority, install and upgrade, node_id: base-bootstrap, layer: meta, phase: pre-build, status: thin}
  - {concern: Contract & proposal, node_id: base-contract, layer: meta, phase: [pre-build, post-build], status: thin}
  - {concern: Contract delivery — artifact publication and verification-status visibility, node_id: base-contract-artifact, layer: meta, phase: [pre-build, post-build], status: thin}
  - {concern: Binding precedents and reconstruction, node_id: base-casebook, layer: meta, phase: [pre-build, post-build], status: thin}
  - {concern: The pioneer's corrections and the fading curve, node_id: base-correction-log, layer: meta, phase: always, status: thin}
  - {concern: Review batches and skill evolution, node_id: base-skill-builder, layer: meta, phase: post-build, status: thin}
  - {concern: Verification-gated learning diff, node_id: base-learning, layer: meta, phase: post-build, status: thin}
  - {concern: Evidence, candidates, re-presented items and maturity instruments, node_id: base-ledger, layer: meta, phase: post-build, status: thin}
  - {concern: Mechanisms — hooks, blind, scopes, seal, telemetry, node_id: base-mechanisms, layer: meta, phase: always, status: thin}
  - {concern: Kit topology, node_id: base-manifest, layer: meta, phase: pre-build, status: thin}
  - {concern: Post-output drift scoring, node_id: base-antidrift, layer: meta, phase: always, status: mature}
  - {concern: Session-level drift analysis, node_id: base-antidrift-expand, layer: meta, phase: post-build, status: thin}
  - {concern: Persistent cross-session drift log, node_id: base-drift-eventlog, layer: meta, phase: always, status: thin}
  - {concern: Type-category extraction & library promotion, node_id: base-extract, layer: meta, phase: post-build, status: thin}
  - {concern: Independent verification, node_id: agent-verifier, layer: meta, phase: post-build, status: thin}
  - {concern: Consolidation and scoring, node_id: agent-consolidator, layer: meta, phase: post-build, status: thin}
  - {concern: Map stewardship, node_id: agent-map-steward, layer: meta, phase: post-build, status: thin}
  - {concern: Review batch assembly and re-presented items, node_id: agent-batch-assembler, layer: meta, phase: post-build, status: thin}
  - {concern: Case law clerking, node_id: agent-case-clerk, layer: meta, phase: post-build, status: thin}
  - {concern: Outside session audit, node_id: agent-session-auditor, layer: meta, phase: post-build, status: thin}
  - {concern: Blind reconstruction test, node_id: agent-reconstructor, layer: meta, phase: post-build, status: thin}
  - {concern: Observation intake while a batch is open, node_id: agent-recorder, layer: meta, phase: post-build, status: thin}

gap_queue:
  # Gaps surface through use — not invented upfront.
  # gap-001 to gap-008 were development history resolved during the build of the base kit.

  - gap_id: gap-001
    concern: Manifest — doc/data co-location
    surfaced_by: contract-before-execution
    surfaced_in: base-kit first use
    description: Single manifest file mixed governance prose with instance data, causing merge conflicts on template updates
    candidate_level: pattern
    priority: high
    status: resolved
    resolved_by: base-manifest split into meta-manifest/SKILL.md + MANIFEST.yaml

  - gap_id: gap-002
    concern: Naming convention — layer prefix vs loader auto-discovery
    surfaced_by: contract-before-execution
    surfaced_in: base-kit rename pass
    description: meta-skill-builder instructed flat file naming which conflicts with Claude Code loader requiring SKILL.md. Convention was unstated.
    candidate_level: pattern
    priority: high
    status: resolved
    resolved_by: Convention clarified — folder carries layer prefix, file is always SKILL.md, manifest uses joined form

  - gap_id: gap-003
    concern: Template drift — exemplars and template blocks edited independently
    surfaced_by: contract-before-execution
    surfaced_in: base-kit rename pass
    description: After renaming filled nodes to folder/SKILL.md form, template comment block still showed old flat-file form.
    candidate_level: principle
    priority: medium
    status: resolved
    resolved_by: Template drift added as anti-pattern to meta-skill-builder

  - gap_id: gap-004
    concern: Incomplete resolution — gap-003 marked resolved while exemplars still contained the bug
    surfaced_by: manual
    surfaced_in: base-kit review after gap-003 resolution
    description: Template comment block was corrected but three filled exemplars still used flat form. Resolution fixed the definition but not the instance.
    candidate_level: principle
    priority: high
    status: resolved
    resolved_by: Exemplar paths updated. Template drift anti-pattern strengthened with self-check step.

  - gap_id: gap-005
    concern: Bootstrap drift — kit named meta-kit-builder instead of base-building-kit
    surfaced_by: manual
    surfaced_in: bootstrap audit
    description: meta-bootstrap referenced the repo name instead of the kit name in two places.
    candidate_level: principle
    priority: medium
    status: resolved
    resolved_by: Both references updated to base-building-kit

  - gap_id: gap-006
    concern: Bootstrap drift — tier model collapsed project and type-category into one
    surfaced_by: manual
    surfaced_in: bootstrap audit
    description: Step 4 created every new project as kit_type type-category, conflating the project context with the overarching standard.
    candidate_level: principle
    priority: high
    status: resolved
    resolved_by: kit_type is now project. category field names the type-category standard.

  - gap_id: gap-007
    concern: Bootstrap drift — vocabulary used type-category to mean uncommitted project nodes
    surfaced_by: manual
    surfaced_in: bootstrap audit
    description: Original wording used type-category loosely to mean nodes not yet built at project level.
