# MANIFEST.yaml
# Instance data for the base-building-kit. Governed by meta-manifest/SKILL.md.
# Updated only through the skill-builder process with developer approval.

kit_identity:
  kit_name: base-building-kit
  kit_type: base
  category: base
  version: 0.13
  parent_kit: null
  status: active

nodes:

  - id: base-foundation
    concern: Philosophical foundation and operational frame — what this work is, the human's role, the agent's role, the governing aspects
    skill_file: meta-foundation/SKILL.md
    layer: meta
    phase: always
    status: mature
    dependencies: []
    open_gaps: []
    note: Load before all other skills. Takes precedence over all other kit nodes.

  - id: base-founding-contract
    concern: The project's own statement of what it is — held as an original that is never rewritten plus dated amendments (each naming its cause and what it now binds); the two-sentence bearing every contract opens with; the two grades of correction (redraw within a correct direction, reevaluation when the direction is off)
    skill_file: meta-founding-contract/SKILL.md
    data_file: meta-founding-contract/FOUNDING.md
    layer: meta
    phase: always
    status: thin
    dependencies: [base-foundation]
    open_gaps:
      - Ported from a downstream kit on 2026-09-03 where it had one instance of use. The bearing and correction-grade rules are prose in meta-contract-before-execution; nothing enforces that a contract carries a bearing or that an amendment carries a cause and a binding clause. The form is enforceable and should be — a check is the next elevation.
    note: Load immediately after meta-foundation. FOUNDING.md is instance data — seeded from templates/FOUNDING.template.md by meta-bootstrap Step 4, never copied from another project, never extracted. The content is unmeasurable and reached by reflection; only the form is enforceable.

  - id: base-bootstrap
    concern: First-run installation — introduces the practice, establishes kit authority, orients to the project, records the pioneer's founding contract verbatim, checks library for existing type-category kit, creates project-level manifest and seeds all instance files from templates
    skill_file: meta-bootstrap/SKILL.md
    layer: meta
    phase: pre-build
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Runs once per project. Not part of the regular load order after first run.

  - id: base-contract
    concern: Contract before execution — bearing (read against the founding contract), spec lock (design-heavy features), three-tier proposal, approval gate with redraw/reevaluation correction grades, standard evolution report
    skill_file: meta-contract-before-execution/SKILL.md
    data_file: meta-contract-before-execution/CONTRACT-LOG.yaml
    layer: meta
    phase: [pre-build, post-build]
    status: mature
    dependencies: [base-founding-contract]
    open_gaps: []
    note: CONTRACT-LOG.yaml persists every approved contract and its status lifecycle (approved/implemented/verified/learned). Read at session start alongside MANIFEST.yaml and DRIFTLOG.yaml to surface any entries awaiting a meta-learning pass. Contract Log schema also documents optional artifact-delivery fields used when base-contract-artifact is active.

  - id: base-contract-artifact
    concern: Contract delivery — every approved contract is also published as an artifact, stored as HTML, and registered with verification status (Verified/Corrected/Open) visible at a glance. Two templates — Analysis Report (findings, ends in a verdict) and Execution Contract (a plan, ends in a gate).
    skill_file: meta-contract-artifact/SKILL.md
    layer: meta
    phase: [pre-build, post-build]
    status: mature
    dependencies: [base-contract]
    open_gaps:
      - Both templates have exactly one real instance of use so far — not yet battle-tested across a range of feature shapes.
      - Requires the Artifact-publishing capability to be available in the environment; an agent/environment without it cannot fulfill the "published" leg of the rule and should flag that gap rather than silently skip it.
    note: Adds two additive fields (file, artifact) plus type/led_to/follows to CONTRACT-LOG.yaml's existing schema — see meta-contract-before-execution/SKILL.md's Contract Log section. Does not require its own data file or template.

  - id: base-skill-builder
    concern: Abstraction loop — classifying learnings, updating skills, raising the standard
    skill_file: meta-skill-builder/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-contract]
    open_gaps: []

  - id: base-learning
    concern: Verification-gated learning diff — contracted prediction vs verified reality, elevation proposals feeding skill-builder
    skill_file: meta-learning/SKILL.md
    data_file: meta-learning/LEARNINGLOG.yaml
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-contract, base-skill-builder]
    open_gaps: []
    note: Invoked explicitly, not part of the continuous load order. Sweeps CONTRACT-LOG.yaml for entries in status verified — not a single named contract — on each invocation. Deepens the Standard Evolution Report; does not replace it.

  - id: base-manifest
    concern: Kit topology — node registry, coverage map, gap tracking, self-organisation
    skill_file: meta-manifest/SKILL.md
    data_file: meta-manifest/MANIFEST.yaml
    layer: meta
    phase: pre-build
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-antidrift
    concern: Post-output drift scoring — compact evidence-based check against governing aspects and active skills after every output
    skill_file: meta-antidrift/SKILL.md
    layer: meta
    phase: always
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Runs after every output. Must be in the continuous load order.

  - id: base-antidrift-expand
    concern: Session-level drift analysis — full pattern mapping, implicit approval accumulation, drift onset point, elevation vs recovery assessment
    skill_file: meta-antidrift-expand/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-antidrift, base-foundation]
    open_gaps: []
    note: Invoked explicitly by the human. Not part of the continuous load order.

  - id: base-drift-eventlog
    concern: Persistent drift log — durable cross-session record of flagged incidents, their evidence, the in-session reaction, and the lifecycle of any elevation that absorbed the learning
    skill_file: meta-drift-eventlog/SKILL.md
    data_file: meta-drift-eventlog/DRIFTLOG.yaml
    layer: meta
    phase: always
    status: mature
    dependencies: [base-antidrift, base-foundation]
    open_gaps: []
    note: DRIFTLOG.yaml is read at session start alongside MANIFEST.yaml. Entries are written only at end-of-session or on human-flagged drift — never silently. Governance travels via meta-extract; instance history does not.

  - id: base-extract
    concern: Type-category kit extraction — separates transferable nodes from project nodes, produces library artifact and META.yaml
    skill_file: meta-extract/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-manifest, base-skill-builder]
    open_gaps: []
    note: Run when developer decides type-category nodes are mature enough for the library.

