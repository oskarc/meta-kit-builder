  - gap_id: gap-029
    concern: Nothing retires a skill — no ownership between skills and the nodes they govern, so a bypassed skill is invisible
    surfaced_by: manual
    surfaced_in: 2026-09-12 pioneer comment after the evidence audit
    # Pioneer's words, verbatim: "Skills should specify nodes, and nodes that are touched without touching the
    # skill is an indication it should be retired or reevaluated, maybe subsumed into other skills."
    # Refined the same day: "the small incremental signals that accrues on use by the agent, when these are
    # assigned to a node, an agent could look for existing skills in that node to look for conflicting
    # statements. Meaning the findings could update or suggest to retire a skill as likely as creating a new
    # skill. this would keep the whole kit fresh and avoid the staleness that otherwise is guaranteed."
    description: Agents declare write scopes and the hook enforces them, but skills declare nothing about which records they govern, and no mechanism notices when a governed record is edited in a session that never loaded the governing skill. The evidence audit found that every growing rule set loses competence and that retirement by coverage, not felt importance, is what preserves it (finding 6); the kit has a rule for adding skills and none for letting one go. Two signals, both mechanical — (a) a bypass tally from a skill-owns-node declaration; (b) the consolidator checking each candidate against the TEXT of its target skill, not only against other candidates, and quoting any passage the accrued sightings contradict, so a candidate's exit is update, retire or new skill with equal standing. Constraints from the audit — edits are targeted at the quoted passage, never a rewrite of the node (finding 7, the consolidator's global rewrite); a pioneer correction that contradicts a skill has authority, an agent observation that does is a drift candidate until independently sighted; the tally is blind to the acting session. Open question the tally cannot answer alone — a bypass means either the skill is dead weight (edit was valid without it) or the map failed to route to it (edit was wrong); telling those apart needs the schema check gap-025 does not yet have.
    candidate_level: principle
    priority: high
    status: resolved
    resolved_by: base-manifest   # contract-004: owns: on every node, owner-check.sh, contradicts: on candidates, update/retire/add exits, status: retired. The open question (bypass = dead weight or mis-routed) stays with gap-025

  - gap_id: gap-030
    concern: The contract log has never been tested as a specification — whether it carries enough to rebuild what it describes is unmeasured
    surfaced_by: manual
    surfaced_in: 2026-09-12 pioneer comment after the evidence audit
    # Pioneer's words, verbatim: "Use the contracts log to build the exact same thing, and compare what was
    # built the second time." Refined the same day into a lifecycle stage: "Lets say that the kit approach is
    # used at the start of a new api. when that api is launched we could take the kit into an empty folder and
    # ask the agent to build what is stated in the contracts log, to read the driftlog for pitfalls, and
    # measure what was built when its done."
    description: The launch rebuild. At a product milestone, an agent in an empty folder — blind to the original code — builds from the contract log, with the driftlog as its pitfall list, and the result is measured against the original. This is the reconstruction test of UC-9 turned on the product, and it supplies the one thing the audit said the kit cannot supply for itself — an OUTSIDE oracle (finding 1) — because the original's black-box tests and the contracts' guarantees score the rebuild, not the builder. It also makes each record's value testable per entry — did the rebuild hit or avoid each pitfall the driftlog names — which feeds gap-029's retirement signal. To be a measurement rather than a demonstration — criteria frozen at kit install (pre-registration, finding 3); arms that differ by which records the builder gets (contracts only; contracts + driftlog; + casebook), since a rebuild that matches from contracts alone says the driftlog carried nothing; mechanical scores before any prose judgement; the prose comparison marked self-graded. Rehearsal available now at no product cost — rebuild the kit itself from contract-001..004.
    candidate_level: principle
    priority: high
    status: in-progress
    resolved_by: null   # contract-006 withdrew the plan from the map and wrote the six conditions for its return in docs/rebuild-design.md; the rehearsal on the kit's own log has not been done

  - gap_id: gap-031
    concern: A contradicting candidate that is "due at once" still waits for two more due candidates before a batch opens
    surfaced_by: manual
    surfaced_in: 2026-09-12 contract-005 (the batch walk, state 57)
    description: contract-004 UC-7 makes a pioneer-sourced candidate with a quoted contradiction review_due immediately, but the stop-gate opens a batch on three due candidates or on any other pioneer-owned item. With nothing else pending, the pioneer's own correction sits due until two unrelated candidates join it. In practice fresh installs carry unratified map entries that open batches anyway, so the wait is short; but the rule as written and the mechanism as built disagree. Fix: count a review_due candidate with a non-empty contradicts like a pending map proposal — one is enough — in stop-gate.sh step 10 and session-start.sh. A mechanism change (M-30): needs its own contract.
    candidate_level: implementation
    priority: medium
    status: open
    resolved_by: null

  - gap_id: gap-032
    concern: The installed copy of meta-bootstrap, not the staged one, is what the map routes an upgrade to — so an old install follows an upgrade text that predates the fields it must migrate
    surfaced_by: manual
    surfaced_in: 2026-09-13 contract-007, building the upgrade rehearsal fixture
    description: M-27 loads the project's own meta-bootstrap. Its upgrade section knows only the migrations that existed when that kit shipped; the staged kit's copy knows what it added since. From 0.15 the session-start hook names the staged copy when .claude/kit-incoming/ exists and the bootstrap's upgrade section opens by deferring to the staged copy, so every later hop is routed correctly. The 0.14-to-0.15 hop itself has neither in the installed kit; there the pioneer's staging message must say "follow the staged kit's meta-bootstrap" (README, Upgrading), and the rehearsal on a copy is what catches an agent that did not. One manual sentence at staging, once per project.
    candidate_level: implementation
    priority: medium
    status: mitigated
    resolved_by: base-mechanisms   # contract-007: session-start staged-kit line + the bootstrap rule; closes fully when no pre-0.15 install remains

