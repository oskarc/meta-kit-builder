# REBUILD.yaml — the launch rebuild plan. Governed by meta-casebook/SKILL.md → The launch rebuild (contract-004).
# In the base-building-kit repo: templates/REBUILD.template.yaml
# In a consumer project: .claude/skills/meta-casebook/REBUILD.yaml
#
# AGENT INSTRUCTIONS:
# meta-bootstrap seeds this file at install (Step 6h) and it is FROZEN from frozen_on: the plan is written before
# the first contract so that what counts as a fair test is decided before anyone knows what got built. A change
# to milestone, oracle or arms after frozen_on is drift (M-18), not a revision. Only `runs` is appended to.
# The plan is the pioneer's: the agent fills in what the pioneer says and never chooses the milestone.

project: __PROJECT_NAME__
frozen_on: __DATE__

# The event that triggers the rebuild — "first public release", "the v1.0 tag", a date — or deferred, when the
# pioneer would rather decide later. Deferred is a plan too; it is surfaced by M-31 until it is given.
milestone: deferred

# What scores the rebuild. The rebuilding agent never sees the oracle as a target: it builds from the records
# in its arm and is measured afterwards. Mechanical scores come first; a prose comparison written by the
# original builder is marked self-graded wherever it is reported.
oracle:
  - every tier_4 acceptance test of every contract in CONTRACT-LOG.yaml, run against the rebuild
  - every tier_3 guarantee, marked met / not met / unassessable
  - every DRIFTLOG entry, marked hit / avoided — whether the rebuild fell into the pitfall the entry names

# What each rebuilding agent is given, and nothing else — never the original code, never the transcripts. A
# rebuild that matches from contracts alone says the driftlog carried nothing; that is a result, not a failure.
arms:
  - contracts only
  - contracts + driftlog
  - contracts + driftlog + casebook

# Appended when a rebuild is run, one entry per arm. Nothing above this line changes.
runs: []
#  - date: YYYY-MM-DD
#    arm: contracts + driftlog
#    tests: {passed: 0, total: 0}
#    guarantees: {met: 0, not_met: 0, unassessable: 0}
#    pitfalls: {hit: 0, avoided: 0, listed: 0}
#    not_carried: |
#      [what the rebuild lacked that the original had — the residue the records did not carry, as a list]
#    self_graded: true            # the prose comparison was written by the original builder
