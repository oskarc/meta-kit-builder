# MANIFEST.yaml
# Project instance data. Governed by meta-manifest/SKILL.md.
# Generated by meta-bootstrap — not filled manually by the developer.
# Updated only through the skill-builder process with developer approval.
# In the base-building-kit repo: templates/MANIFEST.template.yaml
# In a consumer project: .claude/skills/meta-manifest/MANIFEST.yaml
#
# AGENT INSTRUCTIONS:
# Written by meta-bootstrap from templates/MANIFEST.template.yaml, every double-underscore value replaced with what
# project orientation found; none may remain here. This header is refreshed from the template at each upgrade
# (instruction, never record).
# Writing this file with kit_type: project is what switches the mechanisms on (meta-mechanisms).
# base_kit_version and the base nodes below are updated with every base kit release (template drift rule).

kit_identity:
  kit_name: __PROJECT_NAME__
  kit_type: project
  category: __CATEGORY__
  version: 0.1
  parent_kit: base-building-kit
  base_kit_version: 0.25
  library_kit: __LIBRARY_KIT__
  workspace: []              # the other repositories this system is made of: [{name, path, role}], path relative to this one; filled at install from the Step 2 orientation (contract-010)
  status: active

nodes:

  # ─── Base building kit (inherited — do not modify except through an upgrade) ───
  # `load` describes the node's skill_file. base-map and base-founding-contract pair a trigger-loaded
  # skill with an always-loaded data file (MAP.md, FOUNDING.md).

  - {id: base-intent, concern: Always-loaded distillation of the foundation — aspects, how work moves, the drift score block, kind: intent, skill_file: meta-foundation/INTENT.md, owns: [meta-foundation/INTENT.md], layer: meta, phase: always, load: always, triggers: [M-09, M-10, M-28], status: thin, dependencies: [base-foundation], open_gaps: []}
  - {id: base-founding-contract, concern: The project's own statement — immutable original plus dated amendments; the bearing; redraw vs reevaluation, kind: skill, skill_file: meta-founding-contract/SKILL.md, data_file: meta-founding-contract/FOUNDING.md, owns: [meta-founding-contract/FOUNDING.md, meta-founding-contract/SKILL.md], layer: meta, phase: always, load: trigger, triggers: [M-24], status: thin, dependencies: [base-foundation], open_gaps: []}
  - {id: base-map, concern: When to use what — the always-loaded index from named moments to one-hop pointers, kind: map, skill_file: meta-map/SKILL.md, data_file: meta-map/MAP.md, owns: [meta-map/MAP.md, meta-map/SKILL.md], layer: meta, phase: always, load: trigger, triggers: [M-22], status: thin, dependencies: [base-intent], open_gaps: []}
  - {id: base-foundation, concern: Philosophical foundation and operational frame — the work, the roles, the governing aspects, kind: skill, skill_file: meta-foundation/SKILL.md, owns: [meta-foundation/SKILL.md, meta-foundation/INTENT.md], layer: meta, phase: always, load: trigger, triggers: [M-03], status: mature, dependencies: [], open_gaps: []}
  - {id: base-bootstrap, concern: Install and upgrade — practice, orientation, founding contract, mechanisms, agents, instance seeding, kind: skill, skill_file: meta-bootstrap/SKILL.md, owns: [meta-bootstrap/SKILL.md, templates/, meta-manifest/INSTALLED.sha1], layer: meta, phase: pre-build, load: trigger, triggers: [M-27], status: thin, dependencies: [base-foundation, base-mechanisms], open_gaps: []}
  - {id: base-contract, concern: Contract before execution — bearing, spec lock, precedent check, four tiers, approval gate, contract log, kind: skill, skill_file: meta-contract-before-execution/SKILL.md, data_file: meta-contract-before-execution/CONTRACT-LOG.yaml, owns: [meta-contract-before-execution/CONTRACT-LOG.yaml, meta-contract-before-execution/SKILL.md], layer: meta, phase: [pre-build, post-build], load: trigger, triggers: [M-04, M-05, M-06, M-08, M-11], status: thin, dependencies: [base-founding-contract, base-casebook, base-ledger], open_gaps: []}
  - {id: base-contract-artifact, concern: Contract delivery — published and stored with verification status from the verifier's verdicts, kind: skill, skill_file: meta-contract-artifact/SKILL.md, owns: [meta-contract-artifact/], layer: meta, phase: [pre-build, post-build], load: trigger, triggers: [M-06, M-25], status: thin, dependencies: [base-contract], open_gaps: []}
  - {id: base-skill-builder, concern: Review batches and the abstraction loop — verdict before evidence, re-presented items, adoption at the pioneer's level and tier, kind: skill, skill_file: meta-skill-builder/SKILL.md, owns: [meta-skill-builder/SKILL.md, meta-ledger/batches/], layer: meta, phase: post-build, load: trigger, triggers: [M-16, M-17, M-22], status: thin, dependencies: [base-ledger], open_gaps: []}
  - {id: base-learning, concern: Verification-gated learning diff — contracted prediction vs verified reality, kind: skill, skill_file: meta-learning/SKILL.md, data_file: meta-learning/LEARNINGLOG.yaml, owns: [meta-learning/LEARNINGLOG.yaml, meta-learning/SKILL.md], layer: meta, phase: post-build, load: trigger, triggers: [M-13], status: thin, dependencies: [base-contract, base-ledger], open_gaps: []}
  - {id: base-manifest, concern: Kit topology — node registry, coverage map, gap tracking, instrumented promotion, kind: skill, skill_file: meta-manifest/SKILL.md, data_file: meta-manifest/MANIFEST.yaml, owns: [meta-manifest/MANIFEST.yaml, meta-manifest/SKILL.md], layer: meta, phase: pre-build, load: trigger, triggers: [M-22, M-23], status: thin, dependencies: [], open_gaps: []}
  - {id: base-antidrift, concern: Post-output drift scoring, alongside the session auditor's outside score, kind: skill, skill_file: meta-antidrift/SKILL.md, owns: [meta-antidrift/SKILL.md], layer: meta, phase: always, load: trigger, triggers: [M-28], status: mature, dependencies: [base-foundation], open_gaps: []}
  - {id: base-antidrift-expand, concern: Session-level drift analysis, recorded as observations rather than a verdict, kind: skill, skill_file: meta-antidrift-expand/SKILL.md, owns: [meta-antidrift-expand/SKILL.md], layer: meta, phase: post-build, load: trigger, triggers: [M-19], status: thin, dependencies: [base-antidrift, base-foundation, base-ledger], open_gaps: []}
  - {id: base-drift-eventlog, concern: Persistent drift log — evidence, reaction, elevation lifecycle and mitigation medium, kind: record, skill_file: meta-drift-eventlog/SKILL.md, data_file: meta-drift-eventlog/DRIFTLOG.yaml, owns: [meta-drift-eventlog/DRIFTLOG.yaml, meta-drift-eventlog/SKILL.md], layer: meta, phase: always, load: trigger, triggers: [M-08, M-18], status: thin, dependencies: [base-antidrift, base-foundation], open_gaps: []}
  - {id: base-extract, concern: Type-category extraction — nodes, map entries and precedents, with a blind reconstruction test, kind: skill, skill_file: meta-extract/SKILL.md, owns: [meta-extract/SKILL.md], layer: meta, phase: post-build, load: trigger, triggers: [M-26], status: thin, dependencies: [base-manifest, base-skill-builder, base-casebook], open_gaps: []}
  - {id: base-correction-log, concern: The pioneer's corrections, verbatim and graded, and the fading curve, kind: record, skill_file: meta-correction-log/SKILL.md, data_file: meta-correction-log/CORRECTIONS.yaml, owns: [meta-correction-log/CORRECTIONS.yaml, meta-correction-log/SKILL.md], layer: meta, phase: always, load: trigger, triggers: [M-07], status: thin, dependencies: [base-foundation], open_gaps: []}
  - {id: base-casebook, concern: Binding precedents with their facts, scenario cards, reconstruction tests, kind: record, skill_file: meta-casebook/SKILL.md, data_file: meta-casebook/CASEBOOK.yaml, owns: [meta-casebook/CASEBOOK.yaml, meta-casebook/reconstruction/, meta-casebook/SKILL.md], layer: meta, phase: [pre-build, post-build], load: trigger, triggers: [M-04, M-05, M-26], status: thin, dependencies: [base-correction-log], open_gaps: []}
  - {id: base-mechanisms, concern: Hooks that run the lifecycle, the batch blind, agent scopes, the seal, telemetry, the marker-key contract, kind: mechanism, skill_file: meta-mechanisms/SKILL.md, owns: [meta-mechanisms/hooks/, meta-mechanisms/tests/, meta-mechanisms/SKILL.md], layer: meta, phase: always, load: fires, triggers: [M-01, M-02, M-07, M-11, M-12, M-13, M-14, M-15, M-16, M-17, M-21, M-24, M-30], status: thin, dependencies: [base-map, base-ledger], open_gaps: []}
  - {id: base-ledger, concern: Evidence layer — observations, held candidates, review batches, audits, scores, instruments, kind: record, skill_file: meta-ledger/SKILL.md, data_file: meta-ledger/LEDGER.yaml, owns: [meta-ledger/LEDGER.yaml, meta-ledger/telemetry.log, meta-ledger/SKILL.md], layer: meta, phase: post-build, load: offline, triggers: [M-20, M-29], status: thin, dependencies: [base-foundation], open_gaps: []}
  - {id: agent-verifier, concern: Clause-by-clause verification from outside the builder, kind: agent, agent_file: agents/kit-verifier.md, layer: meta, phase: post-build, load: fires, triggers: [M-12], status: thin, dependencies: [base-contract, base-mechanisms], open_gaps: []}
  - {id: agent-consolidator, concern: Sole writer of candidates — counters by reading, fading, outcomes, scores that never score the pioneer, kind: agent, agent_file: agents/kit-consolidator.md, layer: meta, phase: post-build, load: fires, triggers: [M-14], status: thin, dependencies: [base-ledger, base-mechanisms], open_gaps: []}
  - {id: agent-map-steward, concern: Proposes map changes from misses, telemetry and desk probes, kind: agent, agent_file: agents/kit-map-steward.md, layer: meta, phase: post-build, load: fires, triggers: [M-21], status: thin, dependencies: [base-map, base-ledger, base-mechanisms], open_gaps: []}
  - {id: agent-batch-assembler, concern: Assembles review batches from real items, re-presents decided ones from the fourth batch on, and seals the key, kind: agent, agent_file: agents/kit-batch-assembler.md, layer: meta, phase: post-build, load: fires, triggers: [M-16], status: thin, dependencies: [base-ledger, base-mechanisms], open_gaps: []}
  - {id: agent-case-clerk, concern: Clerks corrections into precedents and cards; routes conflicts to the pioneer, kind: agent, agent_file: agents/kit-case-clerk.md, layer: meta, phase: post-build, load: fires, triggers: [M-15], status: thin, dependencies: [base-correction-log, base-casebook, base-mechanisms], open_gaps: []}
  - {id: agent-session-auditor, concern: Evidence-of-form checks and an outside drift score from the transcript, kind: agent, agent_file: agents/kit-session-auditor.md, layer: meta, phase: post-build, load: fires, triggers: [M-11], status: thin, dependencies: [base-antidrift, base-ledger, base-mechanisms], open_gaps: []}
  - {id: agent-reconstructor, concern: Blind reconstruction test — predicts the pioneer's decisions from the kit alone, kind: agent, agent_file: agents/kit-reconstructor.md, layer: meta, phase: post-build, load: fires, triggers: [M-26], status: thin, dependencies: [base-casebook, base-mechanisms], open_gaps: []}
  - {id: agent-recorder, concern: Appends observations handed to it while a review batch closes the ledger to the presenting session, kind: agent, agent_file: agents/kit-recorder.md, layer: meta, phase: post-build, load: fires, triggers: [M-11], status: thin, dependencies: [base-ledger, base-mechanisms], open_gaps: []}

  # ─── Inherited type-category nodes ────────────────────────────────────────
  # Populated by meta-bootstrap if a library kit was integrated, from .claude/library/[category]/META.yaml.
  # __INHERITED_NODES__
  #
  # - id: [node-id]
  #   concern: [concern from library META.yaml]
  #   kind: skill
  #   skill_file: [layer]-[name]/SKILL.md
  #   tier: type-category
  #   layer: [principle | pattern | implementation]
  #   phase: [pre-build | during-build | post-build]
  #   load: trigger
  #   triggers: [M-NN]                     # its map entries, renumbered into this project's map
  #   status: [as per library META.yaml]
  #   inherited: true
  #   inherited_from: [kit_name] v[version] generation [N]
  #   dependencies: []
  #   open_gaps: []

  # ─── Project nodes (discovered through use) ───────────────────────────────
  # Do not populate upfront. Nodes emerge from adopted candidates. Naming: [layer]-[name]/SKILL.md.
  # Every node is added together with its map entry and its `> **Map:**` header (M-22).
  #
  # Phase vocabulary: always | pre-build | during-build | post-build | [pre-build, post-build]
  # Load vocabulary:  always | trigger | fires | offline
  #
  # - id: [concern-id]
  #   concern: [what area this node owns — be precise]
  #   kind: skill
  #   skill_file: [layer]-[name]/SKILL.md
  #   tier: project
  #   layer: [principle | pattern | implementation]
  #   phase: [see vocabulary above]
  #   load: trigger
  #   triggers: [M-NN]
  #   status: [mature | thin | missing]
  #   inherited: false
  #   dependencies: []
  #   open_gaps: []

