# MANIFEST.yaml
# Project instance data. Governed by meta-manifest/SKILL.md.
# Generated by meta-bootstrap — not filled manually by the developer.
# Updated only through the skill-builder process with developer approval.
# Lives at: .claude/skills/meta-manifest/MANIFEST.yaml
#
# AGENT INSTRUCTIONS:
# This file is a template. meta-bootstrap reads it and replaces all
# __PLACEHOLDER__ values with real values derived from project orientation.
# Do not leave any __PLACEHOLDER__ in the written output file.
# When a placeholder line is to be "removed", remove ONLY that line — leave
# the surrounding section header comments intact so the file structure remains
# legible for future updates.

kit_identity:
  kit_name: __PROJECT_NAME__
  kit_type: project
  category: __CATEGORY__
  version: 0.1
  parent_kit: base-building-kit
  library_kit: __LIBRARY_KIT__
  status: active

nodes:

  # ─── Base building kit (inherited — do not modify) ────────────────────────
  # These nodes are always present in every project. They are not subject to
  # the type-category / project tier distinction — they are meta.

  - id: base-foundation
    concern: Philosophical foundation and operational frame
    skill_file: meta-foundation/SKILL.md
    layer: meta
    phase: [pre-build, during-build, post-build]
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-bootstrap
    concern: First-run installation — introduces the practice, checks library, establishes authority, creates project manifest
    skill_file: meta-bootstrap/SKILL.md
    layer: meta
    phase: [pre-build]
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Already run. Not invoked again.

  - id: base-contract
    concern: Contract before execution — three-tier proposal, approval gate, standard evolution report
    skill_file: meta-contract-before-execution/SKILL.md
    layer: meta
    phase: [pre-build, post-build]
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-skill-builder
    concern: Abstraction loop — classifying learnings, updating skills, raising the standard
    skill_file: meta-skill-builder/SKILL.md
    layer: meta
    phase: [post-build]
    status: mature
    dependencies: [base-contract]
    open_gaps: []

  - id: base-manifest
    concern: Kit topology — node registry, coverage map, gap tracking, self-organisation
    skill_file: meta-manifest/SKILL.md
    data_file: meta-manifest/MANIFEST.yaml
    layer: meta
    phase: [pre-build]
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-extract
    concern: End-of-project extraction — separates type-category nodes from project nodes, produces portable library artifact
    skill_file: meta-extract/SKILL.md
    layer: meta
    phase: [post-build]
    status: mature
    dependencies: [base-manifest]
    open_gaps: []
    note: Invoked once at end of project, not during normal development.

  # ─── Inherited type-category nodes ────────────────────────────────────────
  # Populated by meta-bootstrap if a library kit was integrated at startup.
  # Each node is copied from .claude/library/[kit-type]/META.yaml and carries
  # explicit inheritance markers so meta-extract can produce the next
  # generation accurately.
  #
  # Worked example of an inherited node (each entry should follow this shape):
  #
  # - id: pattern-form-progressive-disclosure
  #   concern: Multi-step form structure
  #   skill_file: pattern-form-progressive-disclosure/SKILL.md
  #   layer: pattern
  #   phase: [pre-build, during-build]
  #   status: mature
  #   inherited: true
  #   inherited_from: blazor-web-app v0.4 generation 2
  #   generation_added: 2
  #   inherited_modified: false   # flipped to true by skill-builder if this project evolves the node
  #   dependencies: []
  #   open_gaps: []
  #
  # __INHERITED_NODES__

  # ─── Project nodes (discovered through use) ───────────────────────────────
  # Do not populate upfront. Nodes emerge from Standard Evolution Reports.
  # Naming convention: [layer]-[name]/SKILL.md
  #
  # Nodes added in this generation carry inherited: false. When the developer
  # classifies one as type-category at skill-builder time, it becomes a
  # candidate for promotion into the next generation by meta-extract.
  #
  # - id: [concern-id]
  #   concern: [what area this node owns — be precise]
  #   skill_file: [layer]-[name]/SKILL.md
  #   layer: [principle | pattern | implementation]
  #   phase: [pre-build | during-build | post-build]
  #   status: [mature | thin | missing]
  #   tier: [type-category | project]   # set by developer during skill-builder
  #   inherited: false
  #   dependencies: []
  #   open_gaps: []

coverage_map:

  # ─── Base kit coverage (always present) ───────────────────────────────────

  - concern: Philosophical foundation & governing aspects
    node_id: base-foundation
    layer: meta
    phase: always
    status: mature

  - concern: Project onboarding & authority establishment
    node_id: base-bootstrap
    layer: meta
    phase: pre-build
    status: mature

  - concern: Contract & proposal
    node_id: base-contract
    layer: meta
    phase: pre/post
    status: mature

  - concern: Skill evolution
    node_id: base-skill-builder
    layer: meta
    phase: post
    status: mature

  - concern: Kit topology
    node_id: base-manifest
    layer: meta
    phase: pre
    status: mature

  # ─── Type-category coverage ───────────────────────────────────────────────
  # __INHERITED_COVERAGE__ (replaced with library kit coverage if integrated)
  # Missing nodes below are known concerns every mature kit should cover.
  # node_id fills in as nodes are discovered or inherited.

  - concern: Information architecture
    node_id: null
    layer: principle
    phase: pre-build
    status: missing

  - concern: Cognitive load & layout
    node_id: null
    layer: principle
    phase: pre-build
    status: missing

  - concern: Navigation & IA decisions
    node_id: null
    layer: pattern
    phase: pre-build
    status: missing

  - concern: Design system & feel
    node_id: null
    layer: principle
    phase: pre-build
    status: missing

  - concern: Component structure
    node_id: null
    layer: pattern
    phase: pre/during
    status: missing

  - concern: State management
    node_id: null
    layer: pattern
    phase: during-build
    status: missing

  - concern: Separation of concerns
    node_id: null
    layer: implementation
    phase: during-build
    status: missing

  - concern: Error & edge case handling
    node_id: null
    layer: pattern
    phase: during-build
    status: missing

  - concern: Verification & completion criteria
    node_id: null
    layer: pattern
    phase: post-build
    status: missing

gap_queue: []

library_entry: null
