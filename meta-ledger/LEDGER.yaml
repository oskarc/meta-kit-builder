  - obs_id: O-021
    date: 2026-09-12
    source: verification
    contract_id: contract-005
    refs: [G-1, T-1]
    statement: |
      A blind written against one tool's field names leaks through the next tool's: batch-blind.sh reads Grep's
      glob field and not Glob's pattern, so a Glob for telemetry.log with no path passes. It yields a filename,
      not a line, so nothing is learned — but the verifier found it by reading the hook, not by running the
      fixtures, which only exercised the fields the author had in mind.
    level_guess: pattern
    stated_confidence: 0.75
    loaded_candidates: []
    prompted: false
    consolidated: false
    merged_into: null
    stewarded: n/a

