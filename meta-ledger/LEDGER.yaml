  - obs_id: O-011
    date: 2026-09-12
    source: ser
    contract_id: contract-002
    refs: [G-4, G-6]
    statement: |
      An instrument that publishes its own parameters stops measuring. Printing the count of due items let the
      number of canaries in a batch be derived, and copying real items verbatim let them be identified by their
      absence from the ledger. Blinding has to cover the inputs the measurement is computed from.
    level_guess: pattern
    stated_confidence: 0.55
    loaded_candidates: []
    prompted: false
    consolidated: false
    merged_into: null
    stewarded: n/a

  - obs_id: O-012
    date: 2026-09-12
    source: ser
    contract_id: contract-002
    refs: [G-5]
    statement: |
      Blinding must be structural, not instructed. An agent told to ignore records it can read returns a result
      nobody can distinguish from a checked one — which is the green light on an unmade judgement the practice
      exists to prevent. Where the structure cannot enforce it, the limit is stated in the artifact itself.
    level_guess: principle
    stated_confidence: 0.50
    loaded_candidates: []
    prompted: false
    consolidated: false
    merged_into: null
    stewarded: n/a


  - obs_id: O-013
    date: 2026-09-12
    source: ser
    contract_id: contract-004
    refs: [G-4, G-5]
    statement: |
      The ownership check earns its keep on records, not on skills: an Edit in Claude Code always follows a
      Read, so a skill file edited without being loaded is nearly impossible, while a record edited without its
      governing skill is the common case. Ownership of a skill's own file catches only a Write-without-Read.
    level_guess: implementation
    stated_confidence: 0.70
    loaded_candidates: []
    prompted: false
    consolidated: false
    merged_into: null
