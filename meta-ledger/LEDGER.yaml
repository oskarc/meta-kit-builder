  - obs_id: O-007
    date: 2026-09-12
    source: ser
    contract_id: contract-002
    refs: [G-1, drift-002]
    statement: |
      A state machine written as prose, file by file, produces flags that have a writer and no clearer. Before
      the prose is trusted, every marker needs one table naming its writer, its clearer, its reader and the
      trigger that moves it. Three of the four deadlocks in the v0.14 review were exactly this shape:
      `revealed`, `review_due` and `awaiting-evidence`.
    level_guess: principle
    stated_confidence: 0.75
    loaded_candidates: []
    prompted: false
    consolidated: false
    merged_into: null
    stewarded: n/a

  - obs_id: O-008
    date: 2026-09-12
    source: ser
    contract_id: contract-002
    refs: [drift-002]
    statement: |
      Testing each mechanism in isolation says nothing about the lifecycle they form. All eight v0.14 hooks
      passed their fixtures while the loop they compose deadlocked at the first review batch. A mechanism's
      contract needs a walk-through test: one batch and one contract through every state.
    level_guess: pattern
    stated_confidence: 0.70
    loaded_candidates: []
    prompted: false
    consolidated: false
    merged_into: null
    stewarded: n/a

