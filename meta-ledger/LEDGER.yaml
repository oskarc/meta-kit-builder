  - obs_id: O-019
    date: 2026-09-12
    source: ser
    contract_id: contract-005
    refs: [G-1, contract-004 T-6]
    statement: |
      A later contract can make an earlier contract's test wrong without either being at fault: contract-004's
      T-6 counted the files allowed to name the ownership count, and contract-005's telemetry blind had to name
      it to refuse greps for it. The contract text stays frozen (the hash held); the fixture's expectation moved
      under the follow-up, with the reason beside it. A test's script is the implementation of the test, and the
      follow-up contract is the only place it may change.
    level_guess: principle
    stated_confidence: 0.70
    loaded_candidates: []
    prompted: false
    consolidated: false
    merged_into: null
