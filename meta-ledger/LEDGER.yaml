  - obs_id: O-020
    date: 2026-09-12
    source: ser
    contract_id: contract-005
    refs: [G-3, gap-031]
    statement: |
      Walking the batch end to end found what the direct-write fixture hid: "due at once" (contract-004 UC-7)
      sets review_due but the gate still needs three due candidates, so a lone pioneer correction waits. The
      fixture needed two filler candidates to open the batch — the filler is the finding. A walk that writes the
      end state directly tests nothing about how the state is reached.
    level_guess: pattern
    stated_confidence: 0.80
    loaded_candidates: []
    prompted: false
    consolidated: false
    merged_into: null
