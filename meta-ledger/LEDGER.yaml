# LEDGER.yaml
# Instance data for the base-building-kit repo itself. Governed by meta-ledger/SKILL.md.
# Consumer projects are seeded from templates/LEDGER.template.yaml, never from this file.
# Schema: see templates/LEDGER.template.yaml.
#
# O-001 to O-006 are the Standard Evolution Report for contract-001; O-007 to O-012 for contract-002;
# O-013 to O-018 for contract-004; O-019 to O-021 for contract-005.
# Each stated_confidence was written before any checking and is frozen. Nothing is consolidated: the base
# kit repo does not run its own mechanisms (gap-016), so no consolidator has swept these.

