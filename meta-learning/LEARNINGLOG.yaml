# LEARNINGLOG.yaml
# Instance data for meta-learning. Governed by meta-learning/SKILL.md.
# Each entry represents a verified diff between a contracted prediction and what verification confirmed.
# Written when meta-learning sweeps meta-contract-before-execution/CONTRACT-LOG.yaml for entries in
# status: verified — started by the agent when the stop-gate names M-13. Elevation proposals are also
# recorded as ledger observations (source: learning). See meta-learning/SKILL.md for the full schema and a worked example.
#
# Schema reference:
#
#   - work_id: work-NNN
#     feature: [feature name from contract]
#     contract_id: [reference to contract in CONTRACT-LOG.yaml]
#     surfaced_in: YYYY-MM-DD
#     states:
#       contracted: {approach, principles_invoked, patterns_invoked, precedents_invoked, candidates_cited, assumptions}
#       implemented: {approach, deviations: [{what, authorized}]}
#       verified: {method, verification_ref, result, evidence}
#     diffs:
#       - dimension: [principle | pattern | implementation | stakes]
#         assumption: [...]
#         discovery: [...]
#         learning: [...]
#         node_impact: [{node_id, action: verify | update | contradict | new}]
#     elevation_proposal:
#       - target: [node or new skill]
#         kind: [principle | pattern | implementation]
#         evidence: [...]
#         observation: O-NNN
#         human_decision: pending   # then: trial | adopt | caution | decline | hold | revise

entries: []
