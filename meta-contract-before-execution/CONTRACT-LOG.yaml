    bearing: |
      Four clauses of contract-004 said more than the kit did. This contract makes the kit say it: the bypass count becomes unreadable to the acting session rather than merely unshown; a pioneer correction gets a wire from the corrections log to the ledger, so a correction that contradicts a skill actually reaches a batch; the lifecycle walk carries a contradiction through a real batch and seeds the rebuild plan the way an install does; and two wordings are set right where the kit disagreed with itself. The bet is that closing a verifier's corrections as their own contract, with tests, keeps 004's record honest and costs less than a revision that would blur what it promised.
    tier_1: |
      As the pioneer, I want the verifier's findings closed by changes, not by re-reading. Success looks like:
      the session presenting a batch cannot open the file that holds the bypass counts, so no agent can learn
      it is being counted; a correction I give that contradicts a sentence in a skill shows up in the next
      batch with that sentence quoted, without me repeating it as a separate remark; the walk shows a
      contradiction going into a batch and coming out as a retired passage, so the whole loop has been seen
      once before it runs live; and contract-004 keeps saying exactly what it said. Without it, the count is a
      measure the agent can peek at, the correction route is on paper only, and the retirement loop has never
      been walked end to end.
