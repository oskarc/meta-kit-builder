  - contract_id: contract-016
    feature: The upgrade procedure in steps an agent can follow, with nothing lost - the bootstrap skill's ten longest paragraphs split at line breaks only, not a word changed, and a check that keeps any paragraph from growing back
    type: contract
    follows: contract-015          # split from it at the pioneer's word ("Split allowed."); report-003's sixth weak point
    led_to: []
    date_proposed: 2026-09-19
    date_approved: 2026-09-19
    approval: approved-at-gate     # pioneer: "contract is approved." (2026-09-19)
    bearing: |
      The bootstrap skill is the text an agent follows while the pioneer's records are at risk, and its hardest
      steps are its longest paragraphs; every contract since 007 appended clauses to the same sentences. The bet:
      the same sentences, split into one instruction per line, are followed more reliably, and a size limit
      enforced by a check stops the paragraphs growing back.
    # Bears against paragraph five of the founding statement (the practice guides the pioneer): the upgrade is the
    # practice arriving in a project, and it arrives through this text. Spec lock skipped: the ten paragraphs were
    # measured, not chosen. Precedents: applies P-008 (what is written about the practice can be followed by
    # someone new), P-006 (when work outgrows a limit the work shrinks and the limit stays - this contract creates
    # such a limit).
    tier_1: |
      Each of the ten paragraphs over 1,200 characters becomes a short lead followed by paragraphs or bullets, one
      instruction each. The existing sentences are kept word for word. No rule is added, removed or reworded.
    tier_2: |
      UC-1 The split. The ten paragraphs of the upgrade section are broken up. Step numbers, headings and the order
           of instructions stay as they are, so every reference to "step 3" or "step 7" elsewhere in the kit still
           points at the same thing.
      UC-2 The limit. A new check fails when any paragraph of the bootstrap skill is longer than 1,200 characters,
           naming the line and its length. It runs with the other checks and travels with the kit.
      UC-3 Proof that nothing was lost. A script compares the text before and after. Every piece of the old text
           must be found in the new. The result goes on record.
      Not included: splitting the skill into two files, install and upgrade (the hook installed in the first
           downstream project points at this file and this section name; proposed for after its upgrade);
           shortening the text.
    tier_3: |
      G-1 (UC-1) no instruction added, removed, reordered or reworded; step numbers and headings unchanged.
           applies P-008.
      G-2 (UC-2) bash only; the limit is a number in one place. applies P-006.
      G-3 (UC-3) the comparison is made by a script and by a reader other than the builder, not by the builder's
           own reading.
      G-4 (all) every walk and check passes, and the contract is committed alone.
    disappointment: |
      G-1 to G-4, the pioneer, 2026-09-19: "Disappointment is if we break the bootstrap in any way."
    premortem: |
      Not given at the gate: the pioneer's approving reply held the disappointment line above and the approval.
      Asked when the build was reported, the pioneer, 2026-09-19: "disappointment is the same as pre mortem here."
      So the pre-mortem is the line's words: "if we break the bootstrap in any way." It was read during the build
      as the failure to look for: a bootstrap that reads differently to an agent after the split than before.
    tier_4: |
      T-1 (G-2) No paragraph of the bootstrap skill exceeds 1,200 bytes. The new check passes on the tree, and
           fails on a planted long paragraph, naming the line and the length.
      T-2 (G-1, G-3) With every line break and list marker taken out, the text after is the text before, character
           for character - not piece by piece: the whole file. The install half, above the upgrade section, is
           byte for byte unchanged.
      T-3 (G-1) Every walk state that searches the bootstrap skill's wording still passes, and none of those states
           is edited.
      T-4 (G-3) Two independent readers are used. One is given the upgrade section as it was, the other as it is.
           Each lists, in order, what the agent must do and what it must never do in the rehearsal step and the
           "evolved here" rule. The two lists match in content and order; any difference is fixed or recorded.
      T-5 (G-4) All walks and checks pass. The commit holds only this contract's paths.
      untested: whether an agent follows the new text better in a real upgrade. The rehearsal on the shipped
           fixtures comes next and is where that shows.
      realigned: T-2, by the disappointment line ("break the bootstrap in any way") - drawn as "every piece of the
           old text is found in the new, and every added joining word is listed"; made stricter: no joining words
           at all, the only edit allowed is a line break, and the proof is equality of the whole text. T-2 also
           gained the install half's byte-for-byte check.
