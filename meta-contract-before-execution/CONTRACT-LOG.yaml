  - contract_id: report-001
    type: analysis-report
    feature: the kit in a workspace - what Claude Code loads from each directory of a multi-repository session, and what that does to the kit's hooks and agents
    date_proposed: 2026-09-17
    date_approved: 2026-09-17
    approval: n/a - analysis report, asked for by the pioneer ("figure out how this should work in a multi repo workspace. How do we make the hooks work and agents work?")
    bearing: |
      Not a contract. A report on how Claude Code loads hooks, agents, skills and instructions across the directories
      of one session, read from the docs in full and tested on a fixture of two installed kits, so the pioneer can
      decide what the kit must become for a workspace.
    tier_1: |
      Not a contract. Twelve claims verified against the docs or the kit's code; none corrected; five open questions;
      one contract proposed. The finding: hooks register from the launch directory only, CLAUDE_PROJECT_DIR never
      moves, an added directory contributes skills and agents but no hooks, and the kit's own hooks act on any path
      containing /.claude/skills/ and so log a second kit's reads into the first kit's telemetry (fixture, 2026-09-17).
    tier_2: |
      Options drawn as differences: A - one kit per session, hooks refuse foreign paths, scripts found by walking up
      from cwd; B - root-aware mechanisms (tool events by file path, session and turn events over every known root,
      gate tasks and agent scopes carry the root); C - a kit at the workspace root over kits (rejected: nested kits
      collide, records leave the repositories); D - the kit as a plugin (rejected: plugin agents lose frontmatter
      hooks, so the blinds vanish).
    tier_3: |
      Recommendation, marked as judgement: A now, B as the next contract with A as its first guardrail. Until then:
      start the session in the repository whose kit should run, add the others by their root path, expect their
      skills and agents and not their hooks, and do not edit their records from that session.
    disappointment: n/a - analysis report
    premortem: n/a - analysis report
    red_test: n/a - analysis report
