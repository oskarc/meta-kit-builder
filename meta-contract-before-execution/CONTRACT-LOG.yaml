           gains: every question the real run met was on the sheet; one that was not is recorded under "what this
           did not ask".
      UC-4 The done block. One fixed shape in both flows: verified as counts, nothing waiting or what is waiting
           and how to summon it, what this did not check (the pre-mortem), next session's backlog line named, start
           working. It replaces "What would you like to build first?" and "accept the report".
      UC-5 The grace. The done block's last act writes a done line to telemetry; the stop-gate's review-batch
           step waits until the next session start. Audits and verification are not held.
