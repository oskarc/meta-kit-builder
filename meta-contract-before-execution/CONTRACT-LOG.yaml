  - contract_id: contract-014
    feature: Whatever reaches the pioneer says what it is, why now, and what is asked - one always-loaded rule, applied at every place where the kit puts something in front of them, translated beside the record's own words and never in their place, and checked from outside the session
    type: contract
    follows: report-003            # its second recommendation; from C-019 and C-021
    led_to: []
    date_proposed: 2026-09-18
    date_approved: 2026-09-18
    approval: approved-at-gate     # pioneer: "the contract is approved" (2026-09-18), after adding T-7 (C-021)
    bearing: |
      The kit's agents talk to the pioneer in the kit's bookkeeping: item ids, certainty codes, a confidence
      number. The pioneer corrected this four times in three days, in four different places. The bet: one short
      rule that is always loaded and applied at every place where something reaches them will hold better than
      fixing the review batch alone.
    # Bears against paragraph five of the founding statement (the practice guides the pioneer, the pioneer guides
    # and directs the kit): a pioneer who has to decode a message cannot direct anything. Spec lock skipped: the
    # surfaces were surveyed in report-003. Precedents: applies P-008 (what is written about the practice can be
    # followed by someone new), P-006 (when work outgrows a limit the work shrinks and the limit stays - the
    # intent file had 168 bytes of room), P-001 (survey before fixing - the survey was report-003's table of
    # surfaces). No candidates; no batch open.
    tier_1: |
      A review item tells you in a sentence why it is in front of you now, and what each possible answer would do.
      Certainty, sighting counts and the agent's own forecast come with what they mean, why they are shown, and
      whether anything is asked of you about them.
      After a build you hear what was noted, one plain sentence each, that nothing is asked now, and when it
      will come back.
      A contract names a past ruling by what it held. The id stays in the log.
      When an agent's result is passed on to you - a verification report, a consolidation, a map proposal - it
      arrives in plain words with the ask stated.
    tier_2: |
      UC-1 The rule. One line in the always-loaded intent file, fitted in by trimming elsewhere. One short section
           in the foundation skill with the three parts and a before/after example.
      UC-2 The review batch. The item format gains two lines - why you are seeing this, and what is asked and what
           each answer does. Codes are written out in words. The numbers carry their meaning and their ask.
      UC-3 After a build. The closing block is reworded: each note a sentence, not an id with a number, and
           "nothing is asked now" stated.
      UC-4 The contract draw. Past rulings and held learnings are cited by what they say.
      UC-5 Passing on. The agents' closing messages stay as they are - they are written for the main agent and
           some must stay blind. The rule sits on the main agent at the moment it passes something on. A
           verification report gives each corrected or open clause in words, with the three ways to close it and
           what each means. A drift-score line that lists an unapproved assumption says what the pioneer can do
           about it.
      UC-6 (added with T-7, C-021) The conduct. The foundation skill's section says: before a message goes to the
           pioneer, the agent reads it as they would and rewrites it until it is accessible, clear and actionable.
           The session auditor gains one check, presented for the pioneer: it reads the agent's messages in the
           session and quotes any that carry a bare id, a bare number, or no stated ask where something was needed.
      Not included: the travelling walk, the transcript path, the done script and the bootstrap skill's length
           (contract-015).
    tier_3: |
      G-1 (UC-1) the intent file stays under its size limit, and the limit is not moved. applies P-006.
      G-2 (UC-2) the batch still carries no ledger ids, and nothing in the new lines can tell a re-shown item from
           a new one - its "why now" reads as it did the first time.
      G-3 (UC-3, UC-4, UC-5) only the named sections change. The log and the ledger keep their ids and numbers;
           only what reaches the pioneer changes. applies P-008.
      G-4 (all) each old wording goes on the retired list, every walk and check passes, the contract is committed
           alone.
