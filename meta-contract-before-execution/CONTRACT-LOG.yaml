  - contract_id: contract-008
    feature: the upgrade compares by mechanism — an installed copy of every meta skill as the yardstick, history only for forks that predate it, a migration check for completeness and validity, roots by id, a legacy status for drift, the rehearsal log kept, and the fork's run made whole
    type: contract
    follows: contract-007
    led_to: [contract-009, contract-013]
    date_proposed: 2026-09-15
    date_approved: 2026-09-16
    approval: approved-at-gate     # pioneer: "Then we can approve the contract" (2026-09-16), after UC-1 was revised in the same exchange
    bearing: |
      The upgrade stops asking an agent to compare structured records by reading, and stops asking the pioneer questions a mechanism can answer: the kit keeps the installed copy of every meta skill as the yardstick it already keeps for agents and templates, the base kit's own history stands in only for a fork that predates that copy, the migration is verified for completeness and validity as well as preservation, and a pioneer's deferral gets a value the record can hold. The bet: the first upgrade on a real fork overwrote three of the pioneer's own evolutions without a question and registered six fewer nodes than the template carries, and no sentence added to step 7 would have caught either — only a comparison the agent cannot get wrong.
    # Bears against paragraphs one and three of the founding statement: kits that travel, and "the skills that
    # make up the kit are the organisation's standards" — a fork's evolved skill overwritten silently is the
    # standard overwritten silently. Drawn from the analysis of report-010 (the fork's upgrade) on 2026-09-15:
    # twelve pre-upgrade meta skills hashed against every committed base-kit version — four untouched, six
    # carrying project-authored lines (three of them overwritten without a question), two wrap noise.
    tier_1: |
      As the pioneer, I stage a new kit into a project whose kit I have been evolving for months, some of it
      before the kit had a baseline. I want the upgrade to tell me exactly which lines I wrote in each skill and
      ask me about those — not to ask me twelve questions, and not to decide for me by guessing what counts as
      "project content". I want the migrated records to be complete and valid, not only unbroken: if the
      template registers eight agents, my manifest has eight agents afterwards. When I say "leave those
      seventeen drift entries for later", I want the kit to hold that answer instead of offering them to me two
      at a time for nine batches. And I want the rehearsal's evidence kept, so the report that says "six defects
      caught on the copy" can be checked by someone who wasn't there. Without this, every pre-0.15 fork that
      upgrades pays the same three costs: lost evolutions, an incomplete registry, and a backlog that will not
      clear. The second user is whoever runs the next upgrade on the next fork.
    tier_2: |
      UC-1  Yardstick, not history. At install and at every upgrade the kit keeps the installed copy of each
            meta skill and INTENT.md, as it already keeps agents under skills/agents/ and templates under
            skills/templates/. On an upgrade a meta skill is compared three ways — project copy, installed copy,
            staged copy: lines in the project's copy that the installed copy never had are the project's own,
            and the one question shows those lines: overwrite, keep, or port. No residue, no question. A fork
            with no installed copy (installed before this contract) is compared once against every committed
            base-kit version of the file, which stands in for the installed copy; where that history is not
            reachable the upgrade says so and falls back to one question per differing skill. Edge: re-wrapping
            and whitespace are not residue. (Revised from the proposal's history-shipping version in the
            exchange of 2026-09-16 — history is the fallback, not the mechanism.)
      UC-2  Migration verified three ways. After step 7, each migrated record parses; the number of fields
