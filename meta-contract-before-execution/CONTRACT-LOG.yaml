      the pre-mortem's words, here and as the standing default from now on; the contract skill's gate does not say
      so yet - that sentence is left for the next contract to carry.
    premortem: |
      "Pre mortem is if the agent sums or mispresents or missunderstands what it should ask for, if it is held in a
      way that makes in loose accuracy." - the pioneer, 2026-09-18. Lands on every surface this contract rewrites:
      a translation can lose what the record said. So the design turns on it - the plain words sit beside the
      record's own words and never replace them, the ask is exactly the one the record allows, and the auditor's
      check compares one passed-on item with its source.
    tier_4: |
      T-1 (G-2) A batch built by the assembler from a fixture ledger shows, on every item, a plain "why you are
           seeing this" and an ask with the effect of each answer, beside the statement as recorded, word for word;
