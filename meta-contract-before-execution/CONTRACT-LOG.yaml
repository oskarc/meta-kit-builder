    bearing: |
      A kit can govern a system that lives in several repositories from the one repository it is installed in.
      The bet: the pioneer names the applications once, at install, and the agent does the settings work, so the
      other repositories are places the agent goes, never a second kit.
    # Bears against paragraph one of the founding statement (a kit that travels reproduces the standard wherever
    # it is used - here, across the repositories one system is made of). Drawn from report-001 (led_to below) and
    # the pioneer's requirement of 2026-09-17: "When i install the kit and tell the agent about the applications
    # included in the system flow the agent should do that settings work." Spec lock skipped: the design is
    # report-001's option A plus that sentence. Precedents: applies P-001 (surveyed first), P-004, P-007, P-008.
    # No ledger candidates; no batch open.
    tier_1: |
      At install, the orientation asks which applications make up the system and where each lives. I answer once.
      The agent writes the access grant, the record and the instruction lines. I edit no settings file.
      The kit's hooks, backlog, gate and agents run from the pilot, and the agent reads and edits the other
      repositories without prompts.
      Reads and edits in a repository that carries its own kit are never logged as the pilot's evidence.
      Opening the projects folder and moving into the pilot with /cd runs the pilot's kit, not nothing.
    tier_2: |
      UC-1 The question. Step 2's orientation gains one line: the applications in the system flow, with a path for
           each, confirmed with the rest. On an upgrade the same question is asked only where the manifest has no
           answer yet.
      UC-2 The record. The manifest's identity block gains workspace: one entry per application, name, relative
           path, one-line role. The template ships it empty. Step 7 adds it if absent.
      UC-3 The grant. Step 5c writes every workspace path into permissions.additionalDirectories in the project's
           settings, marked with the kit's key like the hook groups, so an upgrade replaces the kit's entries and
           keeps yours.
      UC-4 The instruction. The CLAUDE.md kit block carries the workspace list, rendered from the manifest, so it
           is refreshed on upgrade with the block and never hand-kept.
      UC-5 Honest hooks. The hook library resolves its root by walking up from the event's working directory to
           the nearest installed manifest, falling back to the launch directory. The two path hooks act only on
           paths under that root.
      UC-6 The moved session. The settings template locates the hook scripts through that same walk, not through
           the launch directory, so /cd into the pilot runs its hooks.
      Not included: governing two kits from one session (report-001's option B).
    tier_3: |
      G-1 (UC-1) bootstrap Step 2 and the upgrade's step 7 text. applies P-008.
      G-2 (UC-2) manifest template, step 7's additive list, and the migration check counts workspace once.
      G-3 (UC-3) step 5c and the upgrade's settings merge. Entries carry the kit's key. bash, sed, awk only.
      G-4 (UC-4) the kit block template and step 5a. The list comes from the manifest, nowhere else.
      G-5 (UC-5) lib.sh, post-read.sh, owner-check.sh. Nothing outside the root is read or logged.
      G-6 (UC-6) settings.template.json command form; every agent's frontmatter hooks the same way.
      G-7 (all) walk-007 gains a state per change, a two-root fixture among them; every check exits 0; nothing
           beyond this list. applies P-007.
