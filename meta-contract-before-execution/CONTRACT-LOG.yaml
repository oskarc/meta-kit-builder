  - contract_id: contract-005
    feature: closing the verifier's four corrections on contract-004 — telemetry blind, the correction-to-ledger wire, the batch walk, two wordings
    type: contract
    date_proposed: 2026-09-12
    date_approved: 2026-09-12
    approval: approved-at-gate     # pioneer: "approved"
    follows: contract-004
    bearing: |
      Four clauses of contract-004 said more than the kit did. This contract makes the kit say it: the bypass count becomes unreadable to the acting session rather than merely unshown; a pioneer correction gets a wire from the corrections log to the ledger, so a correction that contradicts a skill actually reaches a batch; the lifecycle walk carries a contradiction through a real batch and seeds the rebuild plan the way an install does; and two wordings are set right where the kit disagreed with itself. The bet is that closing a verifier's corrections as their own contract, with tests, keeps 004's record honest and costs less than a revision that would blur what it promised.
    tier_1: |
      As the pioneer, I want the verifier's findings closed by changes, not by re-reading. Success looks like:
      the session presenting a batch cannot open the file that holds the bypass counts, so no agent can learn
      it is being counted; a correction I give that contradicts a sentence in a skill shows up in the next
      batch with that sentence quoted, without me repeating it as a separate remark; the walk shows a
      contradiction going into a batch and coming out as a retired passage, so the whole loop has been seen
      once before it runs live; and contract-004 keeps saying exactly what it said. Without it, the count is a
      measure the agent can peek at, the correction route is on paper only, and the retirement loop has never
      been walked end to end.
    tier_2: |
      UC-1  The acting session cannot read telemetry.log — by path or by directory search — at any time. Kit
            agents can. Nothing else about the blind changes.
      UC-2  When the case clerk clerks a correction, it also writes a source: pioneer observation carrying the
            correction id, so the consolidator reads the pioneer's words against the target skill and quotes
            what they contradict. The pioneer is not asked anything.
      UC-3  The walk carries a contradiction candidate through the batch: due → batch assembled → decided
            retire → closed → revealed → terminal state written → gate silent. The rebuild-plan fixture seeds
            REBUILD.yaml with bootstrap 6h's own commands.
      UC-4  Wording: the mechanisms' portability rule is the tool list contracts cite; the ownership check's
            lookback is stated where the hook is documented; the follow-up cross-link has one direction in
            the contract node.
      UC-5  Contract-004's tiers stay byte-for-byte as approved; it is closed by this contract.
    tier_3: |
      G-1  (UC-1)    batch-blind.sh denies the main session's Read, Grep and Glob of meta-ledger/telemetry.log
                     always, not only while a batch is open; agents stay exempt; the inventory row and the blind
