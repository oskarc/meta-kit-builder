  - id: base-embed-before-own
    concern: When extending a host system, embed inside its surfaces before owning a parallel surface — and use the host's specialised widget classes, not generic substitutes. Two failure modes — structural (parallel surface forces re-solving chrome/lifecycle/cross-extension) and behavioural (widget downgrading silently drops state machines, navigation, focus).
    skill_file: principle-embed-before-own/SKILL.md
    layer: principle
    phase: [pre-build, during-build]
    status: mature
    dependencies: []
    open_gaps:
      - Non-Bannerlord worked examples are asserted but not detailed
      - No formal "extension-point inventory" procedure for the host audit

  - id: base-host-already-does-it
    concern: Before claiming a mod / extension needs new infrastructure to support a host feature, verify the host doesn't already do it without that infrastructure. Diagnostic counterpart to base-embed-before-own.
    skill_file: principle-host-already-does-it/SKILL.md
    layer: principle
    phase: [pre-build]
    status: mature
    dependencies: []
    open_gaps:
      - No checklist for "host loading path" audit
      - Boundary with base-embed-before-own described in prose; could be tabulated

  - id: base-verify-api-shape
    concern: When coding against a closed-source library where docs are missing, verify the API's actual shape by inspecting the binary — decompilation, symbol dump, runtime introspection — before writing the client code. Recall is a hypothesis; the binary is the spec.
    skill_file: principle-verify-api-shape/SKILL.md
    layer: principle
    phase: [pre-build, during-build]
    status: mature
    generation_evolved: 13
    dependencies: []
    open_gaps:
      - Platform-specific recipes for non-.NET stacks left to type-category kits
      - No guidance for verifying runtime semantics vs declared shape
      - Gen-13 added the timing clause (a subscription registered after its event has fired is indistinguishable from a working one at every point a compiler or decompiler can see). It states how to establish firing order but offers no mechanical check for it — the current advice is "prefer the event the codebase already uses", which is a heuristic, not a verification.

