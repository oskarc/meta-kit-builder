      - Overlap with prescription-vs-diagnosis is real but the boundary (external vs kit-internal prescription) is qualitative

  - id: revealed-content-carries-latent-bugs
    concern: A change that reveals content the previous layout/state/config was hiding — layout fixes, gate fixes, feature flag ramps, dataset migrations, locale rollouts — exposes every latent bug in that content on the same change. Budget N+1 verification cycles, where N is the cost you'd have estimated treating the change as ordinary. Read every revealed surface against realistic data BEFORE shipping, not after.
    skill_file: principle-revealed-content-carries-latent-bugs/SKILL.md
    layer: principle
    phase: [pre-build, during-build, post-build]
    status: mature
    dependencies: [render-vs-declared, engagement-contract]
