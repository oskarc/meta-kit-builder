  - id: atomic-ship-gate
    concern: The unit of "shipping" is the registration line that makes a feature player-visible, NOT the source files that support the feature. Order the work so the registration line lands LAST — source can land incomplete while the registration is off; the feature only exists in runtime when the registration line is added. Pattern prevents half-built features from leaking mid-implementation by giving the engagement-contract surface a discrete on/off switch.
    skill_file: pattern-atomic-ship-gate/SKILL.md
    layer: pattern
    phase: [pre-build, during-build, post-build]
    status: mature
    generation_added: 2
    dependencies: [engagement-contract]
    open_gaps:
      - No worked example for implicit-visibility shapes (convention-based discovery, reflection scanning, filesystem-based loading) beyond the prose pointer
      - Boundary with feature-flag patterns (which gate visibility in code rather than via registration) only sketched

  - id: migration-by-removal
    concern: Save migrations that retire IDs from a persistent set/dict can be idempotent via natural emptiness — the post-state is its own "done" flag. Second load finds nothing to remove and exits cleanly. No save-version field, no "migration ran" boolean. Applies only to removal-only migrations; data-transforming migrations need version tracking.
    skill_file: pattern-migration-by-removal/SKILL.md
    layer: pattern
    phase: [pre-build, during-build]
    status: mature
    generation_added: 2
    dependencies: [behavior-local-vs-published-state]
    open_gaps:
      - Cross-engine adaptations (non-Bannerlord save shapes) not documented — the .NET / Bannerlord implementation block is specific
      - No guidance on what to do when a migration starts as removal-only and later needs to become transformational

  - id: event-surface-is-the-spec
    concern: When designing a predicate that the runtime must observe (challenge, achievement, gate, log condition), the event surface available at the layer where the predicate evaluates IS the design spec. Consult it before authoring; don't design a predicate that needs data the event API doesn't carry. Right design moves are NARROW the predicate to fit the surface OR ADD A RELAY (writer at the data-rich layer + reader at the predicate-evaluation layer). Wrong move is silent substitution after the fact.
    skill_file: principle-event-surface-is-the-spec/SKILL.md
    layer: principle
    phase: [pre-build, during-build]
    status: mature
    generation_added: 2
    dependencies: [predicate-feasibility-audit, engagement-contract]
    open_gaps:
      - The narrow-vs-relay decision tree is described in prose but not formalised as a checklist
      - No worked example for the relay path (the worked example shows the narrow path); a relay-form worked example would balance the principle

  - id: approximation-policy
