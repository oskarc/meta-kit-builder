  - id: predicate-feasibility-audit
    concern: Before authoring runtime-observed content, walk the spec against the event surface; classify each predicate as wired / patch-needed / substituted / cut / unresolved. Liveness is not efficacy — an effect read inside another subsystem's handler is often gated on that subsystem being active, and a proximity-matching script cannot tell the two apart. A script narrows the candidate set; it never renders the verdict.
    skill_file: pattern-predicate-feasibility-audit/SKILL.md
    layer: pattern
    phase: [pre-build]
    status: mature
    generation_evolved: 13
    dependencies: [engagement-contract, checks-fail-closed]
    open_gaps:
      - No tabular template for the audit output — currently described prose-style
      - The unresolved verdict is new and has never blocked an authoring pass in anger; whether it is honoured or quietly downgraded to "probably fine" is untested.
      - Bannerlord-specific event-surface gap catalogue (the implementation layer beneath this pattern) not yet promoted to its own implementation-* node

