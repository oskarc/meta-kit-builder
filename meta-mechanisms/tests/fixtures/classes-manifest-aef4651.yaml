    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Runs once per project. After completion the kit is load-bearing and this skill is not invoked again.

  - id: contract-artifact
    concern: >-
      HOW a contract is delivered, not what it contains. Every contract is drawn
      in full in chat AND published as an artifact. Two templates — an ANALYSIS
      REPORT for findings and judgement, an EXECUTION CONTRACT for a build plan.
      The artifact must make verification state visible at a glance — what was
      checked against source, what is judgement, what is still open.
    skill_file: meta-contract-artifact/SKILL.md
    layer: meta
    phase: [pre-build, post-build]
    status: emerging
    generation_added: 15
    generation_evolved: 15
    dependencies: [verify-the-output-not-the-mechanism, bannerlord-subagent-verification, checks-fail-closed]
    origin: |
      A concept subagent reported a class income figure as computed evidence; the
      arithmetic was wrong by 28%. In chat prose the wrong figure and the verified
      ones read identically. The delivery layer, not the contract content, is what
      failed — so the fix is a delivery rule rather than another content rule.
    open_gaps:
      - >-
        Storage and the contract log were added after the first two artifacts
        existed, so both were stamped and filed retroactively. Nothing enforces
        that a future contract is stored, registered, or stamped — the rule is
        prose, and this kit has learned twice that a prose rule with no check
        rots quietly.
      - >-
        Both templates are defined. Neither has been used enough to call mature —
        Template A has one instance (a concept review whose central figure it caught
        wrong), Template B has one (the slave-market contract that shaped it).
      - The tension with "contract in chat, never a file" is resolved in prose (chat is primary, redraw whole, artifact is a rendering) but nothing enforces it. An amended-in-place artifact would violate it silently.

  - id: base-contract
    concern: Contract before execution — spec lock (design-heavy features) + three-tier proposal + approval gate + standard evolution report
    skill_file: meta-contract-before-execution/SKILL.md
    layer: meta
    phase: [pre-build, post-build]
    status: mature
    generation_evolved: 2
    dependencies: [contract-artifact]
    verified_by:
