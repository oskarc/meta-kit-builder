gap_queue:
  # Gaps surface here through Standard Evolution Reports as work happens.
  # Format:
  #
  # - gap_id: gap-NNN
  #   concern: [area]
  #   surfaced_by: [contract-before-execution | skill-builder | manual]
  #   surfaced_in: [session or feature]
  #   description: [what the agent had to improvise]
  #   candidate_level: [principle | pattern | implementation | unknown]
  #   priority: [high | medium | low]
  #   status: [open | in-progress | resolved]
  #   resolved_by: [skill or node that closed this, when resolved]
  - gap_id: gap-001
    concern: pair-list completeness
    surfaced_by: contract-before-execution
    surfaced_in: contract-053 phase 8 row audit (2026-09-05)
    description: build_check.py --lint validates a pair list's shape and says nothing about how much of the stylesheet it pairs; a dozen rules went unpaired in two regions and were found by hand.
    candidate_level: implementation
    priority: high
    status: in-progress
    resolved_by: build_check.py --reach (2026-09-05) reports the rules against the rows per selector; the per-region floor is the ruling still to take
  - gap_id: gap-002
    concern: negative plants outside the anchor audit's reach
    surfaced_by: contract-before-execution
    surfaced_in: contract-053 phase 7 (2026-09-05)
    description: audit_negative_anchors.py walks CASES tables only; negative_ranger_district.py plants through functions and its record-row plant went undefended for a phase unnoticed.
    candidate_level: implementation
    priority: medium
    status: open
  - gap_id: gap-003
    concern: the stage agents' registration
    surfaced_by: contract-before-execution
    surfaced_in: contract-053 phases 1-7 (2026-09-05)
    description: .claude/agents/dashboard-exact/*.md are not seen by a session opened above the module; the writer's ten-round cap never bound and every phase overran it three to five times.
    candidate_level: implementation
    priority: medium
    status: open
  - gap_id: gap-004
    concern: the record grid's entry gap
    surfaced_by: contract-before-execution
    surfaced_in: contract-053 phase 7 (2026-09-05)
    description: DashboardRecordGrid applies EntryGap as MarginLeft and MarginRight on every entry, so two entries render at twice the drawing's gap while the row reads EXACT; a left/right slot pair with defaults equal to today's is the G-2-safe fix.
    candidate_level: implementation
    priority: low
    status: open
  - gap_id: gap-005
    concern: layout rules in the pair lists
    surfaced_by: contract-before-execution
    surfaced_in: contract-054 (2026-09-05)
    description: >-
      exactlib has a `layout` kind (fill/content/fixed) but no dashboard's pair list carries a layout row yet; the Frontier's chart svg width is a ruled hole (F45b). The next audit's reader pairs each region's width, height and flex rules, and the first green layout rows prove the kind. EXTENDED 2026-09-06 (SER of contracts 055-059, the Pioneer's word), a fixed height on a region whose content is data-driven is a reservation and hid or clipped its content four times in one session (the v3 list clip, two v4 scroll boxes, the v5/v6 bonus column).
      Fourth recurrence at the note layer; the foundation's escalation clause applies.
      The layout kind carries a rule that a data-driven region's height is fill or content, never fixed, and the check fails a drawing or a pair list that reserves one.
    candidate_level: implementation
    priority: high
    status: open

