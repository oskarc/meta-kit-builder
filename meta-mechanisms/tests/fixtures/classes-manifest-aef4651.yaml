  - id: pattern-evidence-audit
    concern: A pattern extracted from a failure inherits that failure's diagnosis — if the diagnosis was wrong (fixable bug, not architectural mismatch), the pattern is wrong by construction; audit motivating evidence before adopting a pattern as the default for a domain
