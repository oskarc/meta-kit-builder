  # --- Base meta-nodes (inherited from base-building-kit, copied locally) ---

  - id: base-foundation
    concern: Philosophical foundation and operational frame — what this work is, the human's role, the agent's role, the governing aspects. Six governing aspects encoded — lay-of-the-land, stop-when-discipline-falls, partner-as-mirror, evolution-from-elevation, evidence-is-the-work, and (Gen-3 2026-05-25) discipline-is-the-work.
    skill_file: meta-foundation/SKILL.md
    layer: meta
    phase: [pre-build, during-build, post-build]
    status: mature
    generation_evolved: 4
    dependencies: []

  - id: base-founding-contract
    concern: The project's own statement of what it is, held as an immutable original plus dated amendments; the bearing every contract opens with, and the two grades of correction (reevaluation when the direction is off, redraw when it is an adjustment within a correct direction). Instance lives in FOUNDING.md beside the skill.
    skill_file: meta-founding-contract/SKILL.md
    layer: meta
    phase: [pre-build, during-build, post-build]
    status: seeded
    generation_evolved: 1
    dependencies: [base-foundation]
    open_gaps:
      - Gen-2 update (2026-05-24) — added "Evidence is the work, not a detour from it" as the 5th governing aspect, in response to v0.4 class batch drift incidents drift-001 (silent effect substitution under unverified host APIs) and drift-002 (build-cycle treated as verification shortcut). Also absorbed the "SER-silence as maturity signal" closing sentence from VillageInvestment+TOR kits (cross-kit consolidation — all three kit foundations now substantively identical; verified by character-count + normalised-content equality).
      - Gen-3 update (2026-05-25) — added "Discipline is the work, not overhead on it" as the 6th governing aspect, in response to drift-003 (ceremony decay during v0.5 ship session — meta-antidrift never run despite skill being loaded, SER skipped on v0.5 ship, three-tier abbreviated to "three options at same scope" instead of proper User Scenario / Use Cases / Guardrails, audit-derived drift patterns not logged). The 6th aspect is meta to the other five — when practice is treated as overhead, every other aspect can be silently skipped. Surfaced incident is documented in drift-003 with elevation linking back to this node. Cross-kit propagation to VillageInvestment + VillageInvestmentTOR foundations is pending — they currently sit at Gen-2.
      - Gen-4 update (2026-05-27) — extended the "Evolution from elevation, not recovery" aspect with the recurrence-triggered elevation-depth rule. When the same drift root-cause recurs across multiple elevations at the principle / memory / doc-methodology layer, the next elevation must descend to the enforcement layer (a check that fires automatically without requiring the agent or human to remember). Surfaced by drift-006 — substitution-as-final-design root recurred across drift-001 (memory write), drift-005 (doc methodology reinforcement), and drift-006 itself; the drift-006 elevations are the first at the enforcement layer (G4 registration-time validator + G5 API split). Cross-kit propagation to VillageInvestment + VillageInvestmentTOR foundations is pending — both currently lag at Gen-2.
      - Gen-5 update (2026-07-25, Slaver SER C1) — extended the "Lay of the land" aspect: the survey must cover the feature's ENTIRE defining surface (data, config, rule/perk trees), not just runtime behaviors, and a contract's anchors must record the tree. Surfaced when the Slaver Option-A contract anchored behaviors only and missed that the 15-perk prisoner tree already implemented the abstract system's headline (passive income), forcing the Option-B redraw.
    note: Load before all other skills. Takes precedence over all other kit nodes including governance in meta-manifest. Gen-4 (2026-05-27) extends the elevation aspect with the recurrence-triggered enforcement-layer rule — VillageInvestment + TOR foundations are now lagging at Gen-2 until cross-kit propagation happens.

  - id: base-bootstrap
    concern: First-run installation — introduces the practice to the developer, establishes kit authority in the environment, orients to the project, creates the project manifest
    skill_file: meta-bootstrap/SKILL.md
    layer: meta
