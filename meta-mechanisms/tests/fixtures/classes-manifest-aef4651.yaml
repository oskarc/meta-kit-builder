    concern: When a Harmony postfix targets a vanilla concrete (e.g. SandboxAgentApplyDamageModel) and a DLC ships a SIBLING concrete extending the same abstract base (e.g. NavalDLC NavalAgentApplyDamageModel), the postfix is silently dormant in DLC contexts. Dual-bind via reflection-bound HarmonyMethod onto the DLC sibling, gated on the DLC's detection helper. Same postfix body, two targets.
