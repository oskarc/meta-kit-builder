      - tools/verify/negative_contract_log.py
    open_gaps:
      - Proposal format not yet templated for non-developer legibility
      - Gen-3 update (2026-08-24, drift-038) - the id is claimed from the log and the entry is written at the gate; verify_contract_log enforces it from contract-011 on. Entries 011-013 are reconstructed after a compaction and say so.
      - No guidance on handling partial approvals
      - Gen-2 update (2026-05-26) — added Spec Lock layer for design-heavy features, surfaced during v0.8a/v0.8b loops where the user repeatedly redirected mid-three-tier because design questions were buried inside Tier 2 use cases. Spec lock sits upstream of three-tier; resolves the "what is this feature" question explicitly via AskUserQuestion polling before the "how do we build it" three-tier begins. Cross-kit propagation pending VI + TOR.

