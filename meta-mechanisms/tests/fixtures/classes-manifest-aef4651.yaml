      - "Gen-14 (2026-08-09) - added the semantics of a FAILED call as a fourth fact. A negative answer carries only the negation of the question asked; reading one navmesh's silence as a positive fact produced the same bug three times in one function (missing face means Plain, then means sea, then a sea face means water), costing three ship-and-look cycles. Rule - where a classification has more than two outcomes, no single API's failure may select one of them."
      - "The four-facts framing is stated but only shape and timing have worked examples in the node. Reachability and failure-semantics each have one instance."

  - id: embed-before-own
    concern: "When extending a host system, embed inside its surfaces before owning a parallel surface. The host already solves chrome, lifecycle, input and theming; a parallel surface re-solves all of them and drifts from the host on every update."
    skill_file: principle-embed-before-own/SKILL.md
    layer: principle
    phase: [pre-build, during-build]
    status: mature
    dependencies: [host-already-does-it]
    open_gaps:
      - "Registered late (2026-08-09) - referenced as a dependency while unregistered."

  - id: host-already-does-it
    concern: "Before claiming infrastructure X must be added to support feature Y, verify whether the host already supports it. The default assumption should be that a mature host solved the common case already."
    skill_file: principle-host-already-does-it/SKILL.md
    layer: principle
    phase: [pre-build]
    status: mature
    dependencies: [verify-api-shape]
    open_gaps:
      - "Registered late (2026-08-09) - referenced as a dependency while unregistered."


  - id: bannerlord-itemtemplate-root-binding
    concern: "In Bannerlord Gauntlet an <ItemTemplate>'s ROOT widget may not carry its own DataSource. The list host overwrites the instantiated item root's binding path with the item index, silently destroying any DataSource declared there. A nested list must therefore bind on a child of the root, not on the root."
    skill_file: pattern-bannerlord-itemtemplate-root-binding/SKILL.md
    layer: pattern
    phase: [during-build]
    status: emerging
    dependencies: [bannerlord-gauntlet-pre-flight-audit]
    open_gaps:
      - "Registered late (2026-08-09) - the skill existed on disk and was never entered in the manifest, which no tool could report because the manifest did not parse."

  - id: bannerlord-configure-then-bind
    concern: A view that binds on assignment hears nothing set after it - notification-less opt-in slots on a Gauntlet view model must be configured on a local and assigned last; enforced by a sweep that refuses post-assignment mutation through a bound property
    skill_file: pattern-bannerlord-configure-then-bind/SKILL.md
    layer: pattern
    phase: [during-build, verify]
    status: mature
    dependencies: [artifact-as-living-reference, checks-fail-closed]
    open_gaps:
      - Stated for Gauntlet; the same contract holds for any binding framework with notify/no-notify members and is only sketched in the principle line
    # Entered 2026-08-24 from the contract-015 SER: three tuning rounds argued
    # with an ordering defect until a pixel census named the plain button.

  - id: render-census-against-the-palette
    concern: When the look is the spec, the render is measurable - sample the on-disk screenshot for the palette's exact colours and for structural runs, and let the numbers arbitrate a render claim before anyone tunes; pairs with the build sentinel
    skill_file: pattern-render-census-against-the-palette/SKILL.md
    layer: pattern
    phase: [verify]
    status: mature
    dependencies: [build-sentinel, artifact-as-living-reference, verify-the-output-not-the-mechanism]
    open_gaps:
      - The census scripts live in the session scratchpad; a standing tools/verify instrument that takes a screenshot path and a palette class is the next step
    # Entered 2026-08-24 from the contract-015/017 SER: two premature fix
    # claims were refuted by the human and settled by counting pixels.

  - id: widen-signature-not-overload
    concern: When a shared function is found to have been answering the wrong question, widen its signature so every call site fails to compile, and add no overload keeping the old arity - the callers on the wrong path are exactly the set you cannot enumerate by reading, and an overload retains them behind a green build while the repair reads as complete
    skill_file: pattern-widen-signature-not-overload/SKILL.md
    layer: pattern
    phase: [during-build]
    status: emerging
    generation_added: 16
    dependencies: [checks-fail-closed, derived-beats-cached, central-gate-exhaustive-coverage, engagement-contract, verify-the-output-not-the-mechanism]
    open_gaps:
      - Recurrence count is 1. The guarantee is held per-function by a negative case that reintroduces the overload; a standing check that no repaired signature gains a second declaration would be the structural layer if it recurs.
      - The deprecation-surface carve-out for published APIs is named but not worked - it needs its own pattern before anyone follows it.
    # Entered 2026-08-25 from the contract-020 SER: a grade parameter absent from
    # the market's price for three contracts, and the overload that would have
    # kept three call sites silently on the old path.

  - id: write-to-the-set-not-the-instance
    concern: A string on a shared surface renders in every state the surface can hold, not the one in front of the author - text fitted to the visible instance names particulars that turn a general rule into a fact about two cases, and the reader learns the wrong rule; the test is to read the line back with any other member of the set substituted
    skill_file: principle-write-to-the-set-not-the-instance/SKILL.md
    layer: principle
    phase: [during-build]
    status: emerging
    generation_added: 17
    dependencies: [in-world-voice, render-vs-declared]
    open_gaps:
      - Recurrence count is 1 (contract-029, a mechanic's condition line naming the class being played beside the class described). The
        substitution test is mechanical but nothing runs it; the product-level rule (CLASS_TEXT_RULES L4) is prose a human applies.

  - id: surface-audits-the-system
    concern: Building a surface that states what the system actually applies forces a comparison between promise and application that nothing else in a codebase reliably makes - reach for it deliberately when a subsystem has many producers and one shared store, and expect the surface to be right and the system to be wrong
    skill_file: principle-surface-audits-the-system/SKILL.md
    layer: principle
    phase: [pre-build, during-build]
    status: emerging
    generation_added: 17
    dependencies: [engagement-contract, verify-the-output-not-the-mechanism, measure-the-data-before-the-surface, derived-beats-cached]
    open_gaps:
      - Recurrence count is 1 (contract-029 - twelve effect types across four classes applying one hundredth of their authored
        magnitude, found by building the page that states the applied figure). The node claims the audit is cheap; that claim rests on
        one instance and should be re-scored when a second surface is built this way.
      - The twelve consumers it found are NOT fixed. Until they are, the node's own worked example is an open defect in the product.

  - id: concurrent-session-ledger-and-commit
    concern: Two agents in one checkout break a shared ledger's ids (claimed against a maximum that moves) and a commit's shape (split by authorship can separate a file from what it binds to) - enumerate the whole ledger at the moment of writing, and decide a commit's boundary by dependency rather than ownership
    skill_file: pattern-concurrent-session-ledger-and-commit/SKILL.md
    layer: pattern
    phase: [during-build, post-build]
    status: emerging
    generation_added: 17
    dependencies: [guarded-source-mutation, atomic-ship-gate, build-sentinel]
    open_gaps:
      - Recurrence count is 1 for each half, both in contract-029 (an id filed by a concurrent session during the draw; a tree whose
        shared prefab could not be split from another session's view models). Nothing enforces either rule - the id check is a habit
        and the commit-shape judgment is human.
      - Says nothing about locking, branching or coordination between sessions. That is a real question and a different node.

  - id: dashboard-as-journey
    concern: A progression surface is the player's journey - in every state it can show, one glance answers where I stand, where I am in the loop and how far the career has come, and finds exactly one lit verb for the next act; position is the frame's fact and the act gated on it lives in the frame's band, never on a tab
    skill_file: principle-dashboard-as-journey/SKILL.md
    layer: principle
    phase: [pre-build, during-build, post-build]
    status: emerging
    generation_added: 20
    dependencies: [class-dashboard-ia, engagement-contract, artifact-as-living-reference]
    open_gaps:
      - Stated from one class and one session (the Ranger, contracts 055-059, 2026-09-06). The Pioneer named it the core the
        foundational statement for classes is to be drawn from; it is a strong hypothesis until a second dashboard is read against it.
      - The per-state check (three answers, one verb) is run by hand in the drawing's self-consistency pass; nothing enforces it.
      - The code contract that moves the Ranger's game and check from v3 to v6 has not been drawn; the principle is held by a drawing only.

